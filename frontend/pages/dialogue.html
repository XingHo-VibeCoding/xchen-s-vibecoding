<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话 · 口语对话实战器</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <span class="brandtag">AI 当场追问 · 第 1 步</span>
      <h1>口语对话实战器</h1>
      <a class="navlink" href="topics.html">← 回到主题列表</a>
    </div>

    <!-- 面包屑（Day 13）· 层级约定见 TECH_DESIGN.md §4.3
         话题链：主题列表 › 对话。
         顶部的「← 回到主题列表」**保留不删** —— 两者分工不同：
         药丸按钮是「一个明显的去处」，面包屑是「我在哪」。
         删了按钮就等于拿面包屑顶替按钮，那是降级不是优化。 -->
    <nav class="breadcrumb" aria-label="面包屑导航">
      <a href="topics.html">主题列表</a>
      <span class="sep" aria-hidden="true">›</span>
      <span aria-current="page">对话</span>
    </nav>

    <!-- 顶部常驻信息：主题名 / 轮次 / 对话时长（PRD.md §7.3 P2 要求）
         轮次不是固定数字：未开始时显示「准备开始」（#turn-state），
         开始后切换成「第 N 轮」（#turn-count）。两者只有一个是可见的。 -->
    <div class="card">
      <div class="dialogue-head">
        <div>
          <div class="hint">当前主题</div>
          <div class="topic-name" id="topic-name">（未选择主题）</div>
          <!-- 职场角色（Day 10 加练新增，PRD.md §7.3 P2）：告诉用户这一轮扮演谁。
               由下面的脚本从 topics.json 的 role 字段填充；取不到时整行隐藏。 -->
          <div class="topic-role" id="topic-role" hidden></div>
        </div>
        <div class="counter">
          <span class="counter-item">
            <span id="turn-state">准备开始</span>
            <span id="turn-rounds" hidden>第 <b class="counter-inline" id="turn-count">1</b> 轮</span>
          </span>
          <span class="counter-item">
            对话时长 <b id="duration">00:00</b>
          </span>
        </div>
      </div>
    </div>

    <!-- 对话舞台（Day 13）：AI 在这一页的样子 = 一枚会脉动的光球。
         四层结构（光晕 / 涟漪 / 轨道弧 / 核心）全在 .orb 里，纯装饰、
         对屏幕阅读器隐藏 —— 状态由下面那行字传达，不靠图形表达。
         data-mood 由本页脚本随三态写入：rest（未开始）/ listen（你在说）/ hold（已暂停），
         三者的长相定义在 main.css 的「对话舞台 + 光球」一节。
         为什么不做成聊天头像：用户对着「AI」这个名字说话会紧张，
         对着一枚安静发光的东西说话才放松 —— 这是「陪伴感」的落点。 -->
    <div class="stage" id="stage" data-mood="rest">
      <div class="orb" aria-hidden="true">
        <span class="orb-halo"></span>
        <span class="orb-ripple"></span>
        <span class="orb-orbit"></span>
        <span class="orb-core"></span>
      </div>
      <p class="orb-line" id="orb-line">准备好了就说一声，我在这儿。</p>
    </div>

    <!-- 对话记录（Day 14 · F6 第 3 步）
         PRD §7.3 给 P2 列的必现信息里本来就有「用户转写区、AI 回应区」，
         但一直没做 —— Day 13 又把原来那个占位虚线框换成了光球舞台，
         记录区就更没地方放了。这一步补上，**两种模式共用同一套结构**：
         8 个职场主题与自由对话都走这里。
         气泡里的字全部由脚本填，台词来自 topics.json，本页不写死文案。
         语言口径（PRD §6.6、TECH_DESIGN §5.2.1 约定 4）：
         **AI 的台词是英语**；中文只出现在页面说明文字里。
         aria-live 让读屏用户也能听到新出现的那一句。

         ★ Day 19删掉的那条静态说明：这里原来常驻一句
         「本轮 AI 的回应来自本地文案池（大模型接口尚未接入）」。
         它是 Day 17 写的，前提是模型还没接；Day 18 把 /api/chat 打通后，
         这个前提就不成立了，留着会让页面自相矛盾 ——
         上面是deepseek-chat 现场生成的台词，下面写着「来自本地文案池」。
         降级的真实信号由 noteDegraded() 按需追加（带错误码），
         那个是活的、只在真降级时出现，不需要常驻文案替它说话。 -->
    <section class="transcript" id="transcript" aria-labelledby="tr-title">
      <div class="tr-head">
        <h2 class="tr-title" id="tr-title">对话记录</h2>
        <span class="tr-count" id="tr-count">还没有发言</span>
      </div>
      <div class="tr-list" id="tr-list" aria-live="polite">
        <p class="tr-empty" id="tr-empty">
          点「开始说话」之后，你说的话和 AI 的回应会逐句出现在这里。
          直接开口就行，说完停一下系统会自动发出去。
        </p>
      </div>
    </section>

    <!-- 提交发言（Day 14 · F6 第 3 步）
         ★ Day 23 第七次修订：语音已接入（js/speech.js），
           这个文本框**不再是「代替开口的替代品」**，而是两个用途：
             ① 语音的落地处 —— 转写结果先填进这里，用户核对/修改
                （PRD §8.2 E3「转写文字允许用户编辑」就是为这一步留的）
             ② 语音不可用时的降级路径 —— 浏览器不支持、没麦克风、
                密钥没配时，这个框仍然是完整的输入途径
           ★ 所以它一直都在、一直能用，不是「语音没接时的备胎」。 -->
    <form class="composer" id="composer" hidden>
      <p class="queue-note" id="queue-note" hidden></p>
      <textarea class="say-input" id="say-input" rows="2"
                aria-label="你想说的话，用英语"
                placeholder="用英语说说你想说的……"></textarea>
      <button class="primary" id="btn-say" type="submit">我说完了</button>
    </form>

    <!-- 语音状态区：三态切换（未开始 / 正在收你说话 / 已暂停）
         由 dialogue.js 统一管理 state + 文案，HTML 只提供挂载点。
         ★ Day 23 第七次修订：识别改走服务端之后，
           下面那行**不再实时显示英文**（服务端只在录完后给整句），
           实时反馈改成下方的音量条 —— 它是用户判断
           「麦克风有没有在收」的**唯一**依据。 -->
    <div class="recorder" id="recorder" data-state="idle">
      <div class="rec-status">
        <span class="rec-label" id="rec-label">未录音</span>
      </div>
      <div class="rec-live" id="rec-live" hidden>
        <span class="rec-dot" aria-hidden="true"></span>
        <span class="rec-text" id="rec-text">正在听……</span>
        <span class="rec-timer" id="rec-timer">00:00</span>
      </div>
      <!-- ★ Day 23 第七次修订：音量条。
           换成服务端识别后没有「正在听：xxx」这种实时文字了
           （服务端只在录完后给整句），所以这条音量条成了
           用户判断「麦克风到底有没有在收我的声音」的唯一依据。
           没有它的话，用户只能凭猜 —— 而猜错一次就会放弃。 -->
      <div class="rec-meter" id="rec-meter" aria-hidden="true"></div>
      <p class="rec-hint" id="rec-hint">点「开始说话」进入对话状态，计时会从第一次发言开始走。</p>
      <!-- ★ Day 23 新增：语音提示行。
           为什么要有独立的一行而不是塞进 rec-hint：
           这几条是**瞬时状态**（没听清 / 麦克风没权限 / 浏览器不支持），
           处理完就该消失；而 rec-hint 是常驻说明。
           混在一起会让用户分不清「这是长期提示还是刚才出问题了」。
           隐藏时用 hidden 属性，不占布局（不加会留一个空行）。 -->
      <p class="rec-note" id="rec-note" hidden></p>
    </div>

    <!-- 按钮：开始说话（录音中变成 暂停 / 已暂停变成 继续）+ 结束对话
         「说完了」已按 Day 10 决定删去；「结束对话」兼任录音中的「结束本次对话」。
         ★ Day 23 新增「跳过朗读」：AI 开口时想让它闭嘴就点它。
           这是本实现里的「打断」方式——不能靠「一开口就打断」，
           原因见 js/speech.js 顶部那段（浏览器没有回声消除）。 -->

    <!-- ★ 隐私告知（Day 23 第七次修订）—— 必须是**页面上看得见的元素**，
         不能写成 HTML 注释（那是给我看的，用户看不到）。
         为什么必须说：选浏览器原生方案当初就是为了避免这件事
         （TECH_DESIGN §3.3），现在触发退路就得接受它 ——
         而「用户是否知情」不能靠我们自己心里知道。
         ★ 放在按钮附近而不是页脚：页脚没人看。 -->
    <p class="privacy-note">
      语音识别由腾讯云完成：<b>录音会离开你的设备</b>发给它的服务器，
      不落库、不留存，只用于这一次识别。想完全不上传，可以不用语音，直接打字。
    </p>
    <div class="actions">
      <button class="primary" id="btn-talk">🎙 开始说话</button>
      <button id="btn-pause" hidden>暂停</button>
      <!-- ★ Day 23：AI 朗读时才出现。点它 AI 立刻闭嘴。 -->
      <button id="btn-skip-speech" hidden>跳过朗读</button>
      <button class="link" id="btn-end">结束对话 →</button>
    </div>

    <!-- 开发期提示（不再渲染给用户看）：
         「结束对话」会把轮次与时长带到结果页（result.html）。
         Day 10：原为 .placeholder-note 段落，会把内部文档编号显示给终端用户，
         现改为 HTML 注释；该类已随之删除。
         ★ Day 23：「不接真实录音」这句已过期 —— js/speech.js 已接上，
         「开始说话」现在真的会听你说话并转成文字。 -->

    <footer class="page-foot">
      口语对话实战器 · 对话练习页
    </footer>

  </div>

  <!-- 加载顺序有讲究：storage 在前、api 在中、页面逻辑在后——
       storage.js 是 localStorage 的唯一出口（TECH_DESIGN.md §4.2 规矩 2），
       api.js 是后端唯一出口（规矩 1，Day 17 新建）。
       页面逻辑要用 window.Storage 与 window.Api，所以两者都必须先加载。
       ★ speech.js（Day 23 新建）排在 api 之后 —— 它自己不调接口，
         但页面的语音逻辑要等 Api 与Speech 都就绪。 -->
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/speech.js"></script>
  <script>
    // P2 对话页逻辑（Day 10 升级）：
    //   ① 从地址栏取主题编号并在顶部显示主题名
    //   ② 语音区三态切换：idle（未录音）/ recording（录音中）/ paused（已暂停）
    //   ③ 真计时：从第一次点「开始说话」起算，暂停时停住，继续后累计
    //   ④ 「结束对话」= 本轮说完：把该主题的练习次数 +1 存进 localStorage
    //      （跨页面记忆），再把轮次与时长带到结果页
    //   ⑤ Day 13：对话舞台的光球随三态变化（rest / listen / hold），
    //      并同步它上方那行引导语 —— 图形与文字两处都写，
    //      只改图形会漏掉读屏用户（光球对辅助技术是隐藏的）
    //   ⑥ Day 14 · F6 第 3 步：本页开始承载**两种模式** ——
    //      8 个职场主题（F1）与自由对话（F6），靠 topicId 判别。
    //   ⑦ Day 14 · F6 第 3 步：对话记录区（转写 + AI 回应）+ 提交发言，
    //      以及「用户沉默 N 秒由 AI 先开口」（自由对话 5 秒 / 8 主题 8 秒）。
    //
    // 口径说明（以 PRD.md / TECH_DESIGN.md 为准）：
    //   - 「第 N 轮」的含义：这是**该主题第几次练习**，不是一场对话里的第几个回合。
    //     一场内的回合数另有其名（TECH_DESIGN §5.3 的 sessions.turnCount）。
    //     两者是不同东西，所以用独立键 vibecoding.practiceCount 计数（§5.7）。
    //   - 轮次只在点「结束对话」时 +1（= 这一轮真的说完了）；
    //     暂停 / 继续不计轮次，中途点「回到主题列表」也不算完成。
    //   - 时长：PRD §8.2 定义「墙钟时间，从第一次发言起算」，故在第一次
    //     点「开始说话」时起表；暂停期间不计入。
    //   - 真实录音与转写属第 2 步，本页只做界面态与计时，不采集音频。

    (function () {
      var params = new URLSearchParams(location.search);
      var topicId = params.get('topic');
      var nameEl = document.getElementById('topic-name');
      var roleEl = document.getElementById('topic-role');

      /* ---------- 模式：8 个职场主题（F1）/ 自由对话（F6）----------
         判据用 topicId === 'FREE'，不新增数据字段
         （TECH_DESIGN.md §5.2.1 约定 2：本期只有一条自由类条目，
         加 mode 字段要连带改 8 条既有数据，收益不抵风险）。

         两种模式的三处差别（PRD.md §6.6 的对照表）：
           ① 沉默后由 AI 先开口的秒数：自由对话 5 秒 / 8 主题 8 秒
           ② 台词来源：自由对话取 opening + openerPool / replyPool；
                       8 主题取 opening（开场）+ followUpsEn（追问）
           ③ 8 主题一进对话就由对方先开口（场景本身就是"被当场问到"），
              自由对话**不先说话** —— 用户没说话，才由 AI 递一句

         本期没有后端（backend/ 尚未创建），所以 8 主题那句"催促"
         也先由前端从 followUpsEn 取（见 TECH_DESIGN.md §6.2 的说明）。
         接上 /api/chat 后，把 takeLine() 换成网络请求即可，
         界面与流程一个字不用改。 */
      var isFree = topicId === 'FREE';

      /* 用户沉默多久由 AI 先开口。两条线并存、互不影响
         （PRD.md §6.6 边界与约定、§9.2 B27 专门验这一条）：
           自由对话 5 秒 —— 用户拍板值
           8 个职场主题 8 秒 —— PRD §10.1 Q2 的暂定值，没有动过 */
      var SILENCE_MS = isFree ? 5000 : 8000;

      /* AI 说完之后隔多久上屏。这点延迟不是为了装慢，是让「它在回应」
         这件事被看见 —— 立刻出现会像页面闪了一下。520ms 短于一次呼吸。 */
      var AI_DELAY_MS = 520;

      /* 池子取空时的内置兜底（TECH_DESIGN.md §8.2 E12）。
         **必须是英语** —— 与池子语言一致，中文会打断英语语境。 */
      var FALLBACK_LINE = "I'm here. Take your time.";

      // ---------- 元素 ----------
      var el = {
        turnState: document.getElementById('turn-state'),
        turnRounds: document.getElementById('turn-rounds'),
        turnCount: document.getElementById('turn-count'),
        duration: document.getElementById('duration'),
        /* Day 13：对话舞台与光球上方那行字。状态同时写两处 ——
           图形（data-mood 驱动光球）与文字（orb-line）。
           两处都写是刻意的：光球 aria-hidden，只靠它会漏掉屏幕阅读器用户。 */
        stage: document.getElementById('stage'),
        orbLine: document.getElementById('orb-line'),
        recorder: document.getElementById('recorder'),
        recLabel: document.getElementById('rec-label'),
        recLive: document.getElementById('rec-live'),
        recText: document.getElementById('rec-text'),
        recTimer: document.getElementById('rec-timer'),
        recHint: document.getElementById('rec-hint'),
        btnTalk: document.getElementById('btn-talk'),
        btnPause: document.getElementById('btn-pause'),
        btnEnd: document.getElementById('btn-end'),
        /* Day 14 · F6：对话记录区与提交发言（见页面里那两段注释） */
        trList: document.getElementById('tr-list'),
        trEmpty: document.getElementById('tr-empty'),
        trCount: document.getElementById('tr-count'),
        composer: document.getElementById('composer'),
        sayInput: document.getElementById('say-input'),
        /* Day 23：排队提示（AI 还在回，用户又说了几句时的状态） */
        queueNote: document.getElementById('queue-note'),
        /* Day 23：语音提示行 + 跳过朗读按钮 */
        recNote: document.getElementById('rec-note'),
        btnSkipSpeech: document.getElementById('btn-skip-speech'),
        /* Day 23 第七次修订：音量条 */
        recMeter: document.getElementById('rec-meter')
      };

      // ---------- 状态 ----------
      var state = 'idle';   // idle | recording | paused

      /* ★ Day 23：这一场里用户**有没有开口过**。
         为什么单独记一个布尔，不用 turns > 0：
         turns 数的是「说了几句」，而光球文案要区分的是
         「这一场还没轮到你」还是「说过了，该AI 接话了」——
         turns = 1 时两种阶段都可能是「刚说完正等 AI」。
         判据错了文案就会说反（说「等你开口」的时候其实正在等 AI）。 */
      var hasUserSpoken = false;

      /* 用户在本次对话里说过几句。**与下面的 rounds 不是一回事**：
         rounds 是「这个主题练过几次」（点结束对话才 +1 的练习次数），
         turns 是「这一场里我说了几句」—— 它是 TECH_DESIGN.md §5.3
         里 sessions.turnCount 的原始材料。两个数分开放，别混。 */
      var turns = 0;

      /* AI 的三串台词（全部来自 topics.json，本页不写死句子）。
         ★ Day 18 起它们**降级为兜底**：主路径是问 /api/chat 要一句即时回应，
           只有接口失败才用这里的固定台词（并在页面上标明）。
         open    —— 8 主题一进对话就说的第一句
         silence —— 用户沉默时 AI 先开口的接话
         reply   —— 用户说完一句之后 AI 的回应
         8 主题的 silence 与 reply **指向同一个对象**：它的追问只有
         followUps 一串，共用一个游标才不会出现"同一句被问两遍"。 */
      var pools = {
        open:    { lines: [], at: 0 },
        silence: { lines: [], at: 0 },
        reply:   { lines: [], at: 0 }
      };

      /* 当前主题的约束数据（来自 topics.json）。
         ★ Day 18 新增用途：这三个字段是**随请求带给 /api/chat 的**——
           云函数读不到静态目录里的 topics.json，缺了它们追问会跑出主题外。
           「拿到约束数据」和「拿到兜底台词」是同一次 fetch 的两处用途。 */
      var TOPIC = { role: '', anchor: '', followUps: [] };

      /* 本场对话的完整往来，供送给后端当history。
         结构刻意是扁平的 [{who, text}, ...] 而不是 {userText, aiText} 成对 ——
         因为记录区上屏的顺序、谁先谁后都是真实的，
         成对结构在「用户说完但 AI 还没回应」那一刻会记出一个不完整的对子。 */
      var transcript = [];
      /* rounds 的起点不是 0 而是「该主题已完成的次数」：
         进来时若之前练过 1 次，本轮就是第 2 轮，显示「第 2 轮」；
         没练过则保持 0 → 由 render() 显示「准备开始」。 */
      var rounds = (window.Storage && topicId)
        ? window.Storage.practiceCount(topicId)
        : 0;
      var roundsAtEntry = rounds;   // 记为进入时的值，用来判断"这一轮是否已完成"
      var elapsed = 0;      // 累计秒数（不含暂停时段）
      var timerId = null;
      var tickStart = 0;    // 本轮计时起点（毫秒）
      var saveHint = '';    // Day 19：转写没存成的标记，只在点「结束对话」时赋值

      function fmt(sec) {
        var m = Math.floor(sec / 60), s = sec % 60;
        return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }

      // ---------- 计时 ----------
      function startTimer() {
        tickStart = Date.now();
        if (timerId) return;
        timerId = setInterval(function () {
          var now = elapsed + Math.floor((Date.now() - tickStart) / 1000);
          el.duration.textContent = fmt(now);
          el.recTimer.textContent = fmt(now);
        }, 250);
      }

      function stopTimer() {
        if (!timerId) return;
        elapsed += Math.floor((Date.now() - tickStart) / 1000);
        clearInterval(timerId);
        timerId = null;
        el.duration.textContent = fmt(elapsed);
        el.recTimer.textContent = fmt(elapsed);
      }

      // ---------- 状态渲染 ----------
      // 三态的文案与显隐集中在这里，避免散落在各个事件里。
      // Day 13 起这里还多管一件事：光球的状态（mood）与它上方那行引导语（line）。
      // 两者和三态一一对应，所以并入同一张表 —— 加第四个状态时只需在这里补一行，
      // 不会出现「改了文案忘了改光球」这种错位。
      //
      // line 的写法有口径约束（对齐 PRD.md §4.1 H1「用户怕被评判」）：
      // 只说陪伴与鼓励，**不承诺功能、不评价用户说的话**。
      //
      // composer（Day 14 · F6 第 3 步）：提交发言那块的显隐。
      // 只在录音中出现 —— 未开始时还没轮到说，已暂停时用户明确要歇一下，
      // 两种情况下摆一个输入框在那里都是在催他。
      var VIEW = {
        idle: {
          mood: 'rest',
          line: '准备好了就说一声，我在这儿。',
          /*★ Day 23 第七次修订：「未录音」改成「未开始」。
            为什么：现在录音是**真实采集音频**了（不再只是界面态），
            「未录音」这个说法会让人以为「按了才会开始录」——
            实际上点「开始说话」就自动开始收了。
            ★ 更重要的是它得体面：这一栏现在的身份是「对话状态」
              （idle/recording/paused 说的是练习状态，不是设备状态）。 */
          label: '未开始',
          live: false,
          composer: false,
          hint: '点「开始说话」进入对话状态，计时会从第一次发言开始走。',
          talk: { text: '🎙 开始说话', show: true },
          pause: { show: false }
        },
        recording: {
        /* ★ Day 23：光球上方那行引导语按「用户有没有开口过」分两种。
           动机：同伴反馈「AI 一直讲，他没办法说话」——除了被打断，
           还有一层是**他不知道此刻该不该开口**。
           改之前整个 recording 态只有一句「慢慢说，不着急，我听着」，
           用户分不清「该我了」和「AI 在想」，只能等着被催。
           现在两句话各说各的阶段，一眼能看出轮到自己没有。 */
          mood: 'listen',
          /* line 与 text 由 render() 按 hasUserSpoken 覆写，
             这里给的是「还没开口」那一套（recording 态的默认值）。 */
          line: '轮到你了，说什么都行。',
          lineAfterSpeak: '我在听，接着说。',
          label: '正在收你说话',
          live: true,
          text: '等你开口……',
          textAfterSpeak: '正在听……',
          composer: true,
          /*★ Day 23 第七次修订：把「语音怎么用」讲清楚。
            用户报过「说了半天 AI 没反应」——除了 bug，
            也有「他不知道说完要停一下」这一层。
            ★ 明说「说完停一下」：这是语音交互的必需动作，
              不说的话用户会以为要手动点按钮。 */
          hint: '直接说话就行，说完停一下（大约 2 秒），系统会自动发出去。想打字也可以用下面的框。',
          talk: { show: false },
          pause: { text: '暂停', show: true }
        },
        paused: {
          mood: 'hold',
          line: '先歇一下，随时接着说。',
          label: '已暂停',
          live: true,
          text: '已暂停',
          composer: false,
          hint: '点「继续」接着计时，或「结束对话」收尾。',
          talk: { show: false },
          pause: { text: '继续', show: true }
        }
      };

      function render() {
        var v = VIEW[state];
        /* 光球与引导语先写：它们的变化最显眼，放在前面便于核对状态是否真切过去了
           ★ Day 23：引导语与录音区文字按 hasUserSpoken 取两套之一。
             「等你开口」与「我在听」必须是两句话 —— 用一句含糊话覆盖两个阶段，
             用户就不知道此刻该不该出声，这正是同伴反馈里「插不上话」的一半。 */
        var spoken = hasUserSpoken;
        el.stage.setAttribute('data-mood', v.mood);
        el.orbLine.textContent = (state === 'recording')
          ? (spoken ? v.lineAfterSpeak : v.line)
          : v.line;

        el.recorder.setAttribute('data-state', state);
        el.recLabel.textContent = v.label;
        el.recLive.hidden = !v.live;
        if (v.text) {
          el.recText.textContent = (state === 'recording')
            ? (spoken ? v.textAfterSpeak : v.text)
            : v.text;
        }
        el.recHint.textContent = v.hint;

        el.btnTalk.hidden = !v.talk.show;
        if (v.talk.text) el.btnTalk.textContent = v.talk.text;
        el.btnPause.hidden = !v.pause.show;
        if (v.pause.text) el.btnPause.textContent = v.pause.text;

        /* 提交发言：只在录音里出现（理由见 VIEW 里 composer 的注释） */
        el.composer.hidden = !v.composer;

        // 轮次：未开始（idle）显示「准备开始」；一旦开始进入对话就显示「第 N 轮」。
        // 注意两件事：
        //   1. 不能用 rounds > 0 判断「有没有开始」—— rounds 是「这个主题练过几次」，
        //      第一次练习时它就是 0。有没有开始看 state。
        //   2. 显示值是 rounds + 1：rounds 表示「已完成过几次」，
        //      正在进行的这一次是第 rounds+1 轮（所以第一次练就是「第 1 轮」）。
        var started = state !== 'idle';
        el.turnState.hidden = started;
        el.turnRounds.hidden = !started;
        el.turnCount.textContent = String(rounds + 1);
        el.recTimer.textContent = fmt(elapsed);
      }

      // ---------- 对话记录（Day 14 · F6 第 3 步）----------
      // 这里管三件事：取台词、往记录区加一条、「用户沉默则由 AI 先开口」。
      // 台词一句都不写死在本页 —— 全部来自 topics.json（TECH_DESIGN.md §5.2），
      // 将来换措辞只动数据。

      /* 按顺序取一句，取完从头循环（TECH_DESIGN.md §8.2 E12：不走进度、不空转）。
         池子取不到（topics.json 没读上来）时给内置兜底，
         保证 B24「沉默 5 秒必有接话」在任何情况下都成立。 */
      function takeLine(name) {
        var p = pools[name];
        if (!p || !p.lines.length) return FALLBACK_LINE;
        var line = p.lines[p.at % p.lines.length];
        p.at += 1;
        return line;
      }

      function updateCount() {
        el.trCount.textContent = turns ? ('你说了 ' + turns + ' 句') : '还没有发言';
      }

      /* ★ Day 23：排队状态的显示。
         为什么必须让用户看见队列长度：
         排队 = 他说的话已经记下了、AI 正在回上一句。
         不显示的话他会以为页面卡住，或者又点一次「我说完了」
         —— 而第二次会被再排一条，AI 就要回两次，越等越长。
         显示「已排队，AI 回应后会接着说」把因果讲清楚，
         用户就知道现在该等，而不是该点。 */
      function renderQueue() {
        if (!el.queueNote) return;
        var n = pendingQueue.length;
        if (!n) {
          el.queueNote.hidden = true;
          el.queueNote.textContent = '';
          return;
        }
        el.queueNote.hidden = false;
        el.queueNote.textContent = n === 1
          ? '这句已经记下了，AI 回应完就接着说。'
          : '已经记下 ' + n + ' 句，AI 会一句一句接着回。';
      }

      /* 往记录区加一条。who 只有两个值：'user' / 'ai'。
         AI 那一侧的署名就写 "AI"：这一版没给它起人格化的名字，
         页面别处（主题卡、光球）也一律只叫它 AI，保持一致，
         不在这里单独给它一个名字。

         ★ Day 23：AI 那一侧多一件事 —— **朗读出来**（用户明确要求 AI 要能出声）。
           放在 appendLine 里而不是四个调用点各写一遍：
             - 有 4 处 appendLine('ai')（:757/:759/:787/:789），
               漏一处就有一句 AI 永远不出声，而且极难发现
             - 语义上也更对：**凡是上了屏的 AI 台词就该能听**，
               这不是某一处的特性，是 AI 台词的通性
           降级台词（本地句库）同样朗读 —— 用户听见的是同一句话，
           配合 noteDegraded 的说明，不会有「听到的和看到的不一样」。 */
      function appendLine(who, text) {
        // 第一条真发言到了，空态那句话就该退场
        if (el.trEmpty && el.trEmpty.parentNode) el.trEmpty.parentNode.removeChild(el.trEmpty);

        /* 记进 transcript：下一轮问AI 时要把它当上下文发过去（Day 18）。
           只记用户与 AI 的话，降级说明那行不记 —— 它不是对话内容。 */
        transcript.push({ who: who, text: text });

        var row = document.createElement('div');
        row.className = 'tr-row' + (who === 'ai' ? ' is-ai' : '');

        var bubble = document.createElement('div');
        bubble.className = 'tr-bubble';

        var byline = document.createElement('span');
        byline.className = 'tr-who';
        byline.textContent = (who === 'ai') ? 'AI' : '你';

        var line = document.createElement('p');
        line.className = 'tr-text';
        /* 整行都是 ASCII 才套衬线斜体（main.css 的 --font-en）。
           现在两条线的台词都是英语了（FREE 的 openerPool / replyPool、
           8 主题的 followUpsEn），所以正常情况下每句都会套上。
           这道判断仍然留着当防线 —— followUpsEn 缺失时会回退显示中文的
           followUps，中文落进 --font-en 会退到宋体 + 伪斜体，很难看。
           与其相信"数据里一定有英文"，不如让渲染层自己判。 */
        if (/^[\x20-\x7E]+$/.test(text)) line.className += ' en';
        line.textContent = text;

        bubble.appendChild(byline);
        bubble.appendChild(line);
        row.appendChild(bubble);
        el.trList.appendChild(row);
        // 新的一句永远留在视线内：记录区自己滚，不推着整页跑
        el.trList.scrollTop = el.trList.scrollHeight;

        /* ★ Day 23：AI 的台词上屏之后朗读一遍。
           为什么放在这里而不是四个调用点：见上面那段注释 ——
           「凡是上了屏的 AI 台词就该能听」，在这一个函数里写一次就够。
           speakAiLine 内部会判canSpeak()，朗读不可用时静默跳过（E10），
           文字照常显示、对话不阻塞。 */
        if (who === 'ai') speakAiLine(text);
      }

      /* ---------- 沉默计时：轮到用户说的时候才走 ----------
         起算点（PRD.md §6.6 边界与约定）：进入对话状态时、
         以及**每次 AI 说完之后**；用户提交发言即重置。
         两条线的秒数不同，见文件开头的 SILENCE_MS。

         ★ Day 23 修订：起算点加一条硬前提 —— **输入框里有字就不倒计时**。
           动机来自同伴反馈的实测：「AI 一直讲，他没办法说话」。
           8 秒这个数是按「真人对话里的接话间隔」定的，但本期是文本框：
           在输入框里组织一句 A2 英语要 15–30 秒，那 8 秒里 AI 插进来，
           用户的句子必然写到一半被打断 —— 体感就是「我一直插不上话」。
           ★ 只改「什么时候开始算」，**不改 8 秒/ 5 秒这两个值**
             （这两个是用户拍板的，PRD §6.6 与 B27 验收都写着），
             「停手不说了超过 8 秒 AI 仍会先开口」这条验收仍然成立。 */
      var silenceTimer = null;
      var aiTimer = null;

      /* ★ Day 23：待发队列。
         为什么需要它：改之前 submit 里是 `if (CHAT_BUSY) return;` ——
         AI 等后端的那 3–8 秒里，用户点「我说完了」，**这一句既不上屏、
         也不清空、也没有任何提示**。用户以为自己没点到，于是反复点，
         反复被吞。这是「他说不了话」最直接的机制性原因。
         现在改成：话**当场上屏**（用户能看见自己说过了），
         再把「让 AI 回什么」压进队列，AI 一空闲就按顺序发出去。
         队列里排队的条数会显示在按钮上方，用户知道要等多久。 */
      var pendingQueue = [];

      /* ★ Day 23：判断「用户是不是正在准备说话」——
         返回 false 才可以起算倒计时 / 开口催促。

         ★★ Day 23 二次修订（同伴实测「AI 还是在插嘴」后发现上一版漏了）：
         上一版只看 `sayInput.value` 有没有字 —— 于是两种情况照样被催：

           ① 光标落在输入框里、正在想怎么措辞，但一个字都还没打
              （想 15秒 → 第 8 秒就被催，而此时框里是空的）
           ② 倒计时已经排定在跑，中途用户才开始打字
              （起算那一刻判定是"没在打字"，之后就不管了）

         所以现在补两样：
           - **焦点在输入框**也算正在组织语言（覆盖 ①）。
             焦点是比字数更早的信号：他点进来就是要说话。
           - 倒计时回调里**再判一次**，并且监听 input 事件主动取消（覆盖 ②，见 bindGuards）。 */
      function userIsTyping() {
        if (pendingQueue.length) return true;
        /* ★★ Day 23 第三次修订：语音模式下**永远算「正在说话」**。
           为什么：识别开着就说明麦克风在工作，用户随时可能开口。
           原来只用「有没有字 / 焦点在不在框里」判断，
           而语音场景里他**根本不在打字** —— 于是 8 秒倒计时照跑，
           他思考停顿超过 8 秒，AI 就抢先开口了。
           这是「第 1 步修好了、语音一接上来又回来」的原因：
           计时器整套是为「打字时代」设计的，语音形态下不该存在。 */
        if (SPEECH_OK) return true;
        if (!el.sayInput) return false;
        if (el.sayInput.value && el.sayInput.value.trim()) return true;
        // 光标在框里就是「打算说」——哪怕还没落一个字
        return document.activeElement === el.sayInput;
      }

      function clearSilence() {
        if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      }

      function armSilence() {
        clearSilence();
        // 没在对话（未开始 / 已暂停）就不计时 —— 停表要连沉默一起停
        if (state !== 'recording') return;
        /* ★★ Day 23 第三次修订：语音模式下**不排定倒计时**。
           语音里「你说完了」由静音检测（speech.js 的 1.2 秒）负责，
           已经有第二套计时器了 —— 两个计时器同时跑必然打架：
             静音检测在等你说完，沉默倒计时在等你开口。
             谁先到谁先生效，于是「停顿久一点AI 就自己说自己的」。

           ★ 那B27「沉默 8 秒必有接话」怎么办？
             它是**打字时代的验收项**（8 秒这个数是按真人对话定的）。
             语音形态下它的对应物是「你沉默时 AI 有没有递话」——
             而语音里用户开口成本极低、几乎不会沉默，催不催意义不大。
             浏览器不支持语音时（Firefox）会自动退回打字模式，
             那时 SPEECH_OK 为 false，倒计时就照常跑 —— **B27 仍成立**。
             用户拍板：「语音下彻底关掉」。 */
        if (SPEECH_OK) return;
        /* 正在组织语言（或队列里还压着话）就不倒计时。
           队列这一条同样重要：用户已经开口了，只是 AI 还没答完，
           这时候催他等于催一个正在排队的人。

           ★ 这里**直接返回、不排定**是对的：等 blur（他停手、点走）
             或提交之后，由那两处重新起算。见 bindGuards。 */
        if (userIsTyping()) return;
        silenceTimer = setTimeout(function () {
          silenceTimer = null;
          /* ★★ Day 23 二次修订：开口的这一刻**再看一次**。
             倒计时是 8 秒前排定的，这 8 秒里用户可能刚开始打字/点了输入框。
             第 1 版不在这里判，于是「排定时没在打字」就一路催到底——
             这是同伴第二次反馈「AI 还是在插嘴」的直接原因。 */
          if (!userIsTyping()) aiSay('silence', 0);
          /* ★★★ 这里**什么都不做**，是刻意的，不是漏写。
             第 2 版曾写成 `else armSilence()`，想给他「重新来一轮」，
             结果把自己锁死了：armSilence 开头判 userIsTyping() 为 true
             就直接 return，于是这个定时器永远排不上、也永远不响——
             定时器被吃掉、且没有任何补偿。
             症状是「用户一开始打字，AI 就再也不主动开口了」，
             那比插嘴更糟：沉默催促是 B27 验收项，功能被悄悄废掉。

             正确做法：他把焦点留在框里期间**本来就不该有倒计时**；
             等他说完、焦点离开（blur）或提交，由那两处重新起算。
             这一路只需让计时器自然结束。 */
        }, SILENCE_MS);
      }

      /* ---------- AI 说一句：先问后端，失败回落本地句库（Day 18）----------
         改造前的做法是直接 takeLine(name) 取一句本地台词。
         现在改为：先向 /api/chat 要一句**模型现场生成**的话，
         拿不到（或超时、或没配好密钥）才回落本地句库。

         ★ 为什么保留本地句库而不是直接报错：
           接口一挂，页面就变成一片死寂 —— 用户看到的是「我说了话但没人理」，
           那比「显示固定台词」糟得多（记录页同一条理由，见 Day 17）。
           固定台词虽然机械，但**页面永远能继续练下去**。

         ★ 为什么必须标明降级：
           固定台词是假的「即时回应」。用户若分不清，
           会以为模型就是这种水平 —— 那比直接报错更伤。
           所以降级时在记录区留一行小字说明（见 noteDegraded）。

         silenceSeconds 的传递很关键：
           0 → 正常回应；>0 → 模型知道用户在沉默，走的是「把人拉回来」的提示词，
           与「继续聊天」是两种语气（云函数里分开写的）。
         -------------------------------------------------------------- */
      var CHAT_BUSY = false;   // AI 正在等后端（防重复提交）

      function askAi(opts) {
        if (!window.Api || !topicId) return Promise.resolve(null);

        var payload = {
          topicId: topicId,
          userText: opts.userText || '',
          history: historyForApi(),
          silenceSeconds: opts.silenceSeconds || 0,
          /* ★ kind 要告诉云函数「这轮用户有没有开口」：
             open（8 主题开场）与 silence（沉默催促）时用户还没说话，
             userText 天然为空；云函数据此跳过 userText 的必填校验。
             不传的话开场白会被判INVALID_PARAMS —— 实测踩过。 */
          kind: opts.silenceSeconds > 0 ? 'silence' : (opts.kind || 'reply'),
          role: TOPIC.role || '',
          anchor: TOPIC.anchor || '',
          followUps: TOPIC.followUps || []
        };

        return window.Api.chat(payload).then(function (r) {
          return (r && r.aiText) ? r.aiText : null;
        }).catch(function (err) {
          /* 只记错误码，不把技术细节写给用户看。
             密钥、路径、厂商报错都不该出现在练习界面上。 */
          lastChatError = (err && err.code) ? err.code : 'UNKNOWN';
          return null;
        });
      }

      /* 送给后端的历史：格式就是契约 §3 的 {turn, userText, aiText}。
         ★ 只带已完成的往返，不带 aiSay 正在等的那句（那还没上屏）。 */
      function historyForApi() {
        return transcriptTurns(6);      // 与云函数 MAX_HISTORY 一致，两边都截
      }

      /* 转成 {turn, userText, aiText} 的共用转换。
         maxTurns 传 null 表示**全量**（analyze 要整场，契约 §4 的 transcript）。

         为什么 chat 只取最后 6 轮、analyze 要全量：chat 是「接着这一句往下聊」，
         给太多历史模型会顾此失彼（而且每次都要重发，更慢更贵）；
         analyze 是「回头把整场逐条判一遍」，只给 6 轮会漏掉前面说过的话，
         用户会发现「我明明说错了一句，页面上却没有」。

         ★★ Day 19 实测修正：**不能按 `i += 2` 等间隔配对**。
           原写法假设「下标 0 一定是 user，然后 user/ai 严格交替」——
           8 主题里因为 AI 一进场就说opening，下标 0 恰好是 user，一直没出事。
           但FREE 模式 AI 不先说话（PRD §6.6），第一句是用户说的沉默催促之后
           才接的，实际数组长这样：

               ["ai", "user", "ai", "user", "ai", "ai"]
                        ↑ 下标 1 才是 user

           按 i += 2 去看就全错位，一个 user 都配不出来 →
           转写变成空数组 → analyze 收不到任何内容。
           实测症状很隐蔽：**界面完全正常**（记录区照样显示 AI 说的话），
           只有结果页说「没有这一场的对话内容」，
           而那看起来像存储坏了，不像配对逻辑错了。

           现在改成**顺序扫描**：记住「最近一条 user 的原话」，
           遇到 ai 就把它当成那条 user 的回应。
           这样无论数组从谁开始、交替是否严格，都不会漏。 */
      function transcriptTurns(maxTurns) {
        var out = [];
        var pending = null;      // 最近一条还没配上 AI 回应的 user 发言
        for (var i = 0; i < transcript.length; i++) {
          var it = transcript[i];
          if (!it) continue;
          if (it.who === 'user') {
            /* 连着来了两句 user（AI 还没回上一句时用户又说了）——
               上一条没等到回应就作废，不硬凑一个空 aiText 给它，
               否则 analyze 会以为「用户说了这句，AI 回了个空」。 */
            pending = { turn: out.length + 1, userText: it.text, aiText: '' };
            out.push(pending);
          } else if (it.who === 'ai' && pending) {
            pending.aiText = it.text;
            pending = null;
          }
          /* ai 在 pending 为空时（用户还没说话就先开口）直接跳过 ——
             没有对应的用户发言，它不是任何一轮的回应。 */
        }

        if (maxTurns === null || out.length <= maxTurns) return out;

        /* ★ 截断后**重新编号**（turn 从 1 连续起算），不能沿用原下标。
           为什么：turn 是 analyze 引回原句的唯一依据（契约 §4 硬约束 1
           ——「模型只回编号，原文由后端按编号取回」）。
           云函数把 transcript 建成 byTurn[turn]，模型回 7 它就取 byTurn[7]。
           若这里截断后给出的是 5..10，而云函数收到的数组下标其实是 0..5，
           两边对不上 → 取不到原句 → 整条被丢弃（约束 1 的「查不到就丢弃」）。
           所以编号必须**从 1 开始连续** —— 它标的是「这是本次请求里的第几轮」，
           不是「这是整场的第几轮」。 */
        var tail = out.slice(-maxTurns);
        for (var k = 0; k < tail.length; k++) tail[k].turn = k + 1;
        return tail;
      }

      /* 本地台词池：模式不同，装配方式见文件末尾那段 topics.json 加载 */
      function localLine(name) {
        return takeLine(name);
      }

      var lastChatError = '';

      /* AI 说一句。kind 只影响语气标签，当前界面不显示它，
         但记进 transcript 便于将来做「追问」样式（契约 §3 的 followUpType）。

         ★ Day 23：说完之后**先看队列有没有人在等**（pumpQueue），
           队列空了才重新起算沉默倒计时。
           改之前是「说完就 armSilence」—— 用户在 AI 回答期间又说了两句，
           那两句（队列里）还在等，AI 却已经重新开始数 8 秒要催他了。 */
      function aiSay(name, delay, opts) {
        if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
        aiTimer = setTimeout(function () {
          aiTimer = null;
          CHAT_BUSY = true;

          var isSilence = (name === 'silence');
          askAi({
            userText: (opts && opts.userText) || '',
            kind: name === 'open' ? 'open' : 'reply',
            silenceSeconds: isSilence ? Math.round(SILENCE_MS / 1000) : 0
          }).then(function (aiText) {
            CHAT_BUSY = false;
            if (aiText) {
              appendLine('ai', aiText);
            } else {
              appendLine('ai', localLine(name));
              noteDegraded(lastChatError);
            }
            /* ★ Day 23：优先清队列，没人等才回到「等用户开口」状态。
               注意 armSilence 放在 pumpQueue 之后 —— 顺序反了的话，
               队列里有人等的时候倒计时也会被挂上（虽然 armSilence
               自己有pendingQueue.length 的判断，但显式顺序更不容易读错）。 */
            if (pendingQueue.length) {
              pumpQueue();
            } else {
              armSilence();
              renderQueue();
            }
          });
        }, delay || 0);
      }

      /* ★ Day 23 新增：把排队的话依次送去问 AI。
         一次只发一条（并发问会让模型的上下文互相看不见，
         而且 order 不可控）。每条都带当轮的 userText。 */
      function pumpQueue() {
        if (CHAT_BUSY || !pendingQueue.length) return;
        var next = pendingQueue.shift();
        CHAT_BUSY = true;
        askAi({ userText: next, kind: 'reply', silenceSeconds: 0 })
          .then(function (aiText) {
            CHAT_BUSY = false;
            if (aiText) {
              appendLine('ai', aiText);
            } else {
              appendLine('ai', localLine('reply'));
              noteDegraded(lastChatError);
            }
            renderQueue();
            /* 还有人排就继续发，都发完了才回到「等你开口」。
               renderQueue 必须在 pumpQueue 之前 —— 它要先更新
               「还剩几句」的计数，用户才不会看着数字不动。 */
            if (pendingQueue.length) {
              pumpQueue();
            } else {
              armSilence();
              renderQueue();
            }
          });
      }

      /* 降级说明：紧跟在 AI 那句后面显示一行小字。
         为什么用小字而不是醒目提示：这是**临时状态说明**，不是错误警告——
         用户不需要为它做什么，放太显眼反而打断练习节奏。 */
      function noteDegraded(code) {
        /* ★ Day 23：原来直接写 '（' + code + '）'，
           页面上会出现「这一句用的是预设台词，不是即时回应（LLM_TIMEOUT）」
           —— 用户看到的是英文下划线大写，不知道那是什么意思。
           现在走 Api.friendlyOf() 拿中文人话。
           ★ 下面 onError 那套**故意不用** Api.friendlyOf：
             它分得比通用映射更细（区分「麦克风没授权」「格式不支持」…），
             通用表给不出这个精度，两者不是同一层的东西。 */
        var why = (window.Api && window.Api.friendlyOf) ? window.Api.friendlyOf({ code: code }) : '';
        var hint = '这一句用的是预设台词，不是即时回应' + (why ? '（' + why + '）' : '');
        var row = document.createElement('div');
        row.className = 'tr-note';
        row.textContent = hint;
        el.trList.appendChild(row);
        el.trList.scrollTop = el.trList.scrollHeight;
      }

      /* ================= Day 23：语音接线 =================
         上面那些是「文字时代的」逻辑；下面把 speech.js 接进来。

         ★ 一句话说明这套东西改变了什么：
           **不再靠 8 秒倒计时判断「你说完了」，改用静音检测**。
           你说完停一下（约 2.5 秒），系统自动识别并提交。
           倒计时逻辑（armSilence 等）**保留但降级为备用** ——
           浏览器不支持语音时（Firefox），整套体验回落到打字，
           那时它还得工作。这不是冗余，是降级路径。

         ★ 为什么转写落进输入框而不是直接上屏：
           PRD §8.2 E3「转写文字允许用户编辑」——中文口音识别不准是已知的
           （PRD R1）。让他能改，才是对的做法。而且改了直接点「我说完了」，
           流程不多一层。 */
      var SPEECH_OK = !!(window.Speech && window.Speech.supported());

      /* ★★ Day 25 修（状态文字抖动）：记住「上一次判定的有没有在说话」，
         只在**真的翻转**时才改 DOM。null = 还没写过，第一帧一定要写一次。
         ★ 迟滞（hysteresis）：开口要求 ≥6、停下要求 <3，中间地带保持不动。
           用同一个阈值的话，麦克风底噪会让数值在阈值上下反复横跳 → 文字闪烁。 */
      var recTextVoiced = null;
      var VOICE_ON_PCT = 6;
      var VOICE_OFF_PCT = 3;

      /* ★★ Day 25 修（提示区一路长高）：把「诊断段」和「瞬时提示」
         分开存，**渲染时才拼**。
         改之前只有一份字符串、新提示只能往后接（diag + '　|　' + msg）——
         于是同一句「听到了，正在识别」被接了十几遍，提示区长到四五行，
         把下面的按钮越推越远。根因是「只有一份、只能追加」，
         不是「某条文案太长」。拆开之后：诊断段照旧**保留**（Day 23 的初衷不变），
         瞬时提示变成**替换**语义 —— 接多少次都只占一行。 */
      var diagText = '';   /* 只装【诊断】段：常驻，不随倒计时消失 */
      var liveMsg = '';    /* 只装当前那一条瞬时提示：会被替换/清空 */

      function renderNote() {
        if (!el.recNote) return;
        var parts = [];
        if (diagText) parts.push(diagText);
        if (liveMsg) parts.push(liveMsg);
        el.recNote.textContent = parts.join('　|　');
        el.recNote.hidden = parts.length === 0;
      }

      /* 语音提示行：显示即自动消失的瞬时状态。
         ★★ Day 23 第六次修订（保留）：**别把诊断信息冲掉** ——
            诊断恰恰是排查「为什么不录音」的唯一线索。 */
      function noteSpeech(msg, ms) {
        if (!el.recNote) return;
        liveMsg = msg;
        renderNote();
        if (noteSpeech._t) clearTimeout(noteSpeech._t);
        noteSpeech._t = null;
        if (ms !== 0) {
          noteSpeech._t = setTimeout(function () {
            /* ★ 到期只清瞬时提示，诊断段留着 ——
               它是给人排查用的，不该跟着倒计时一起消失。 */
            liveMsg = '';
            renderNote();
          }, ms || 6000);
        }
      }

      /* 清空整个提示区（诊断段 + 瞬时提示）。
         ★★ Day 25：每开新一场都调一次 —— 否则每点一次「开始说话」，
         诊断段都会再追加一遍，同样会无限长高（和瞬时提示同一个根因）。 */
      function clearSpeechNote() {
        if (noteSpeech._t) { clearTimeout(noteSpeech._t); noteSpeech._t = null; }
        diagText = '';
        liveMsg = '';
        renderNote();
      }

      /* ================= 诊断行（Day 23 第五次修订）=================
         为什么加这个：用户报「完全没反应」时，最花时间的**不是修 bug，
         是不知道卡在哪一步** —— 是不支持语音？是没麦克风？
         是权限被拒？还是识别起来了但提交失败？四种情况的修法完全不同，
         没有诊断就只能一轮轮问。

         ★ 这一行是给「试的人」看的，不是给最终用户看的：
           它常驻、不自动消失、信息密度高。
           最终用户看到的是 degradeToText / noteSpeech 那两句人话。 */
      function noteDiag(msg) {
        if (!el.recNote) return;
        var txt = '【诊断】' + msg;
        /* 追加而不是覆盖：一次点「开始说话」要报好几项，
           覆盖的话只剩最后一项，看不到前面的关键信息。
           ★★ Day 25：改为写进 diagText 再统一渲染（原来直接改
           textContent）—— 追加语义不变，但它不会再和瞬时提示
           混成一条只能越来越长的串。 */
        diagText = diagText ? (diagText + '　|　' + txt) : txt;
        renderNote();
      }

      /* 点「开始说话」时打一遍环境快照。
         ★ 麦克风权限**真的去问一次** —— 这是唯一能确认
           「浏览器到底给不给」的办法，光看 API 存在没用。 */
      function diagnose() {
        if (!el.recNote) return;
        var supported = !!(window.Speech && window.Speech.supported());
        var canSpeak = !!(window.Speech && window.Speech.canSpeak());
        var secure = (location.protocol === 'https:' ||
                      location.hostname === 'localhost' ||
                      location.hostname === '127.0.0.1');
        noteDiag(
          '支持语音=' + (supported ? '是' : '否') +
          '｜能朗读=' + (canSpeak ? '是' : '否') +
          '｜安全来源=' + (secure ? '是' : '否') +
          '｜后端=' + (window.Api ? '就绪' : '未加载')
        );
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          noteDiag('这个浏览器没有麦克风接口（device=无）');
          return;
        }
        /* 不 await：诊断不能挡住对话流程。 */
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function (stream) {
            noteDiag('麦克风=已允许');
            /* 拿到就立刻关掉：这里只要「准不准」这个信息。 */
            if (stream && stream.getTracks) {
              stream.getTracks().forEach(function (t) { t.stop(); });
            }
          })
          .catch(function (err) {
            var n = (err && err.name) || 'UNKNOWN';
            noteDiag('麦克风=' + n +
              (n === 'NotAllowedError'
                ? '（浏览器拒绝了：地址栏右侧小锁 → 麦克风 → 允许）'
                : '（没有设备，或被微信/钉钉等程序占用）'));
          });
      }

      /* 浏览器不支持：说清楚 + 保留打字能力。
         ★ 不能静默降级 —— 用户会以为麦克风坏了。 */
      function degradeToText(why) {
        SPEECH_OK = false;
        noteSpeech(why + '先在下面的框里写下你说的话，效果一样。', 0);
        /* 按钮文案改掉「说话」两个字：它现在不录音了，
           还写「开始说话」就是又一次误导（同Day 23 开头那个问题）。 */
        el.btnTalk.textContent = '开始练习';
      }

      /* ---------- 识别 → 提交 ---------- */
      /* 转写完成后**不直接提交**，而是填进输入框 + 自动提交。
         为什么自动提交而不是等你点：
           语音的交互节奏是「说完→等回应」，中间插一个「点我说完了」
           会把语音的优势全丢掉（那正是你今天遇到的问题）。
         为什么仍然填进输入框：
           E3 —— 识别错了你要能改；而且填进去之后，
           即使识别失败，页面也留得住你这句话。 */
      /* Day 23 第七次修订：改名 onSpeechFinal → onSpeechResult。
         「final」是浏览器识别才有的概念（interim/final），
         换成服务端识别后没有中间结果了，叫 final 会误导。 */
      function onSpeechResult(text) {
        if (!text || !text.trim()) return;
        el.sayInput.value = text.trim();
        updateCount();
        /* 焦点进框：让用户能立刻改（E3），也让
           userIsTyping() 判true —— AI 不会在这期间催他。 */
        focusComposer();
        el.sayInput.focus();
        /* 触发提交走同一个入口，不要另写一份提交逻辑 ——
           两条路必须行为一致（入队、计数、转写、焦点处理全一样）。 */
        submitSpeech();

        /* ★★ Day 23 第四次修订：提交后**立刻**恢复识别。
           为什么要这一句：AI 回话要3–8 秒，这几秒里用户很可能已经在说
           下一句了（真人对话就是这样）。不重启的话，那几秒说的话会被丢掉 ——
           而且是**静默丢掉**，用户根本不知道。

           为什么不会和AI 的朗读撞上：
             startListening 内部有 `if (speaking) return 'busy-speaking'`
             —— AI 正在朗读时它不启动，不会把AI 的声音当成用户输入。
             等朗读结束那侧还会再调一次（见 speakAiLine），两边不冲突。 */
        if (SPEECH_OK && state === 'recording') {
          window.Speech.startListening();
        }
      }

      /* 复用一个已有的提交按钮，避免「两条路径行为不一致」。 */
      function submitSpeech() {
        var form = document.getElementById('composer');
        if (!form) return;
        if (typeof form.requestSubmit === 'function') {
          form.requestSubmit();
        } else {
          /* 老浏览器没有 requestSubmit：造一个 submit 事件。
             ★ 要 cancelable，否则 submit 处理器里的 e.preventDefault()
               在合成事件上可能不生效。 */
          form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }
      }

      /* 把 speech.js 的回调接到页面
         ★ Day 23 第七次修订：识别方案从「浏览器原生」换成「录音上传」，
           所以这一整套回调**重写了**。对照关系：
             ~~onInterim~~  →  onVolume（浏览器不再返回中间结果，只能看音量）
             ~~onQuieting~~  →  onStateChange('transcribing')（录音结束、正在上传）
             ~~onFinal~~     →  onResult
             ~~onEmpty~~     →  onEmpty（不变）
             ~~onError~~     →  onError（错误码换了，去掉 aborted/no-speech）

           ★ 为什么「浏览器识别」这条路整个换掉：
             Chrome 的 SpeechRecognition **不是本地识别**，它把录音传到
             Google 的服务器去识别，国内访问不通就一直等（真机报 network）。
             这不是代码问题，继续调参数没有用。 */
      function bindSpeech() {
        if (!window.Speech) return;

        /* 音量：让用户看到「麦克风真的在收你的声音」——
           换成服务端识别后没有中间结果了，这行是唯一的实时反馈。
           ★ 为什么用音量条而不是文字：服务端识别拿到的是整句，
             「正在听：xxx」这种实时的半句话已经没有了。 */
        window.Speech.on('onVolume', function (level) {
          if (!el.recMeter) return;
          var pct = Math.min(100, Math.round(level * 600));
          /* ★★★ Day 25 修（「那块一直闪」的根因）：
             这里是 `el.recMeter.style.width = pct + '%'` —— 改的是**轨道自己**的宽度，
             而 .recorder 是 flex-wrap 行：轨道一宽一窄，右边 #rec-hint
             就被推来推去（音量再大点还会把整行顶得换行）。
             现在只改自定义属性 --voice，尺寸交给 CSS：
             轨道固定 140px 不动，只有 ::after 那段填充在长。
             ★ 为什么以前看不出问题：::after 的 width 写死 0 且没人改，
               所以「填充」从来没显示过 —— 用户看到在动的是灰色轨道本身。 */
          el.recMeter.style.setProperty('--voice', pct + '%');
          el.recMeter.style.opacity = pct > 0 ? '1' : '0.25';

          /* ★★ Day 25 修（「那块地方一直跳」的根因）：
             这个回调是**每一帧**都跑的（约 60 次/秒）。原来它每帧都写
             textContent，而两条文案长度差一倍（6 字 vs 14 字）——
             .rec-text 在 .rec-live 里，.rec-live 又与 #rec-hint
             挤在 .recorder 同一行 flex 里：宽度一变，右边那行说明文字
             就被推来推去，看起来「一直在跳」。
             改法：① 只在翻转时写一次 ② 加迟滞（见 VOICE_ON_PCT）
                   ③ 宽度由 CSS 锁死（.rec-text{min-width}），双保险。 */
          if (!el.recText) return;
          var voiced = recTextVoiced;
          if (pct >= VOICE_ON_PCT) voiced = true;
          else if (pct < VOICE_OFF_PCT) voiced = false;
          if (voiced === recTextVoiced) return;   /* 没翻转 → 一个字都不碰 */
          recTextVoiced = voiced;
          el.recText.textContent = voiced
            ? '正在听……（说完停一下就好）'
            : '等你开口……';
        });

        /* 录音态变化：'recording' / 'transcribing' / 'idle' */
        window.Speech.on('onStateChange', function (st) {
          if (st === 'transcribing') {
            /* ★ 这一句很重要：上传 + 腾讯云识别要 1–3 秒，
               不说的话用户看到「停住了，什么都没发生」，
               会以为又不灵了，然后重复说话 → 被当成两句。 */
            if (el.recText) el.recText.textContent = '听到了，正在识别……';
            noteSpeech('听到了，正在识别（第一次会稍慢一点）。', 3000);
          } else if (st === 'idle') {
            if (el.recMeter) { el.recMeter.style.setProperty('--voice', '0%'); el.recMeter.style.opacity = '0'; }
          } else if (st === 'recording') {
            if (el.recText) el.recText.textContent = '正在听……（说完停一下就好）';
          }
        });

        /* 转写完成 → 走提交 */
        window.Speech.on('onResult', onSpeechResult);

        /* 没听清：重开录音，用户不需要做任何事 */
        window.Speech.on('onEmpty', function () {
          noteSpeech('这句没听清，再说一次好吗。', 4000);
          if (el.recText) el.recText.textContent = '等你开口……';
          if (SPEECH_OK && state === 'recording') {
            window.Speech.startListening();
          }
        });

        /* 错误（E1 麦克风未授权、密钥没配、网络不通等） */
        window.Speech.on('onError', function (code) {
          if (code === 'not-allowed' || code === 'denied') {
            degradeToText('麦克风没有授权。请点浏览器地址栏的小锁允许使用麦克风。');
          } else if (code === 'audio-capture' || code === 'mic-failed') {
            degradeToText('找不到麦克风（可能正被微信/钉钉等程序占用）。');
          } else if (code === 'no-api') {
            degradeToText('语音接口没接上，先打字也一样。');
          } else if (code === 'no-supported-format' ||
                     code === 'recorder-init-failed') {
            /* ★ 格式不支持：不是浏览器不支持语音，是它录音的格式
               腾讯云不收（Chrome 默认 webm，腾讯云只收 m4a/mp3/wav 等）。 */
            degradeToText('这个浏览器录音格式不支持语音识别，先用文字。');
          } else if (code === 'ASR_NOT_CONFIGURED') {
            degradeToText('语音识别服务还没配好（缺密钥），先用文字。');
          } else if (code === 'ASR_AUTH_FAILED') {
            degradeToText('语音识别密钥无效，先用文字。');
          } else if (code === 'ASR_BAD_AUDIO') {
            noteSpeech('音频格式识别不了，先用文字。', 5000);
          } else if (code === 'ASR_RATE_LIMITED') {
            noteSpeech('识别请求太频繁，慢一点再试。', 5000);
          } else if (code === 'ASR_TIMEOUT' || code === 'ASR_UNREACHABLE') {
            noteSpeech('识别服务连不上或超时，检查网络后重试。', 5000);
          } else if (code === 'HTTP_404' || code === 'HTTP_501' ||
                     code === 'HTTP_404_NOT_JSON') {
            /*★ 404/501 在这里几乎总是「云函数还没部署」或「网关路由没加」，
              跟用户没关系 —— 页面不该让他以为是自己操作错了。 */
            noteSpeech('语音接口还没部署好（服务端问题），先用文字。', 6000);
          } else {
            noteSpeech('语音识别暂时用不了，先在下面的框里写下你说的话。', 6000);
          }
          noteDiag('语音失败：' + code);
        });

        /* 跳过朗读：AI 开口时想让它闭嘴就点它。 */
        if (el.btnSkipSpeech) {
          el.btnSkipSpeech.addEventListener('click', function () {
            window.Speech.stopSpeaking();
            if (el.btnSkipSpeech) el.btnSkipSpeech.hidden = true;
            if (SPEECH_OK && state === 'recording') {
              window.Speech.startListening();
            }
          });
        }
      }

      /* AI 上屏后朗读一句。
         ★ 朗读失败（E10）不阻塞：文字照常显示，只是没有声音。 */
      function speakAiLine(text) {
        /* ★★ Day 23 第四次修订：**不能因为不能朗读就不重启识别**。
           原写法是`if (!canSpeak()) return;` —— 于是「没有语音合成能力」
           这条路径上，识别永远不再重启：用户能听到第一句，之后说的一律
           没反应。这与「朗读失败」是**两件独立的事**，
           把它们绑在一起会让「没声音」变成「没法说话」。

           正确做法：没有朗读能力也要回到「在听你说话」——
           语音形态下的常态是「轮到你了」，朗读只是附加的。 */
        if (!window.Speech || !text) return;
        if (!window.Speech.canSpeak()) {
          /* 浏览器没有语音合成：文字照常，识别继续。 */
          if (SPEECH_OK && state === 'recording') window.Speech.startListening();
          return;
        }
        window.Speech.speak(text).then(function (ok) {
          if (el.btnSkipSpeech) el.btnSkipSpeech.hidden = true;
          if (!ok) {
            noteSpeech('这遍没有声音，看文字也一样。（朗读功能不可用）', 5000);
          }
          /* 读完回到「在听你说话」——语音形态下这才是常态。 */
          if (SPEECH_OK && state === 'recording') {
            window.Speech.startListening();
          }
        });
        if (el.btnSkipSpeech) el.btnSkipSpeech.hidden = false;
      }

      /* ---------- 「正在组织语言」的三道闸（Day 23 二次修订）----------
         userIsTyping() 改成看焦点之后，就得让焦点真的待在输入框里 ——
         否则那道判断形同虚设（光标在别处，它永远返回 false）。
         三处配套：
           ① 开始说话 / 暂停后继续 → 主动把焦点放进输入框
             （用户点「继续」的意图就是「我要说了」）
           ② 提交之后 → 焦点**留在**输入框
             （点「我说完了」按钮会把手柄带走；不拉回来，
               用户正在想下一句时页面以为他没在说话）
           ③ 输入框 focus / input / blur 三个事件直接驱动计时器：
             一开始打字就取消已排定的催话；离开输入框才重新起算。

         ★ 为什么 ② 特别重要：它同时解决了「提交后 8 秒被催」
           和「点继续后 8 秒被催」两个场景 —— 用户在按钮上点了提交，
           光标被按钮带走，接下来 8 秒他都在想措辞，而页面判他「没在说话」。
           这是上一版剩下最大的一处漏洞。 */
      function focusComposer() {
        if (!el.sayInput) return;
        try { el.sayInput.focus({ preventScroll: true }); }
        catch (e) { el.sayInput.focus(); }   // 老浏览器不支持 options 对象
      }

      function bindGuards() {
        if (!el.sayInput) return;

        /* 焦点进来 = 他打算说话 → 立刻取消催话。
           这一条覆盖了「还没落字就在想措辞」那段最容易被抢走的时间。 */
        el.sayInput.addEventListener('focus', function () {
          if (state === 'recording') clearSilence();
        });

        /* 开始打字 → 取消催话。
           ★ 不在这里重新起算：他手还在键盘上，起算等于又开始数他打字的时间。
             真正的「说完停手了」由 blur 或提交后重新判断。 */
        el.sayInput.addEventListener('input', function () {
          if (state === 'recording') clearSilence();
        });

        /* 焦点离开（点别处 / 切标签页）→ 他不打算说了，重新给一轮倒计时。
           不这么做的话：他点完提交顺手点了个别处，AI 就再也不开口了
           （因为最后一次 clearSilence 之后再没人 arm 过）。 */
        el.sayInput.addEventListener('blur', function () {
          // 有内容说明他还在写，只是点了别处 —— 不催
          if (state === 'recording' && !userIsTyping()) armSilence();
        });
      }

      // ---------- 事件 ----------
      // 开始说话：本轮正式起步，起表。
      // 轮次不在这里 +1 —— 轮次表示「这个主题练过几次」，由「结束对话」完成一轮时才累加。
      el.btnTalk.addEventListener('click', function () {
        state = 'recording';
        /* ★ Day 23：每开一场对话都从「还没开口」重新起算。
           不重置的话，上一场说过话的光球文案（「我在听，接着说」）
           会带进这一场 —— 而这一场其实还没轮到用户开口。 */
        hasUserSpoken = false;
        pendingQueue.length = 0;
        renderQueue();
        render();
        startTimer();

        /* 谁先开口，两种模式不同（见文件开头isFree 那段）：
             8 个职场主题 —— 场景本身就是"被同事 / 上司当场问到"，
                             所以一进来由对方说第一句（topics.json 的 opening）
             自由对话     —— **不先说话**。PRD.md §6.6 的规则是"点开始后
                             5 秒内用户没说话，AI 才先开口"，
                             这里只把沉默计时挂上，让 opening 在第 5 秒出现

         ★ Day 23 二次修订：最后把焦点放进输入框。
           8 主题这条路径之前有个隐蔽漏洞：开场白说完 → armSilence，
           而这时焦点还停在「开始说话」按钮上 → userIsTyping() 返回 false
           → 用户正打算开口就被排上了倒计时。
           焦点进框之后，那 8 秒从他准备好说话的那一刻才开始算。 */
        focusComposer();
        if (isFree) armSilence();
        else aiSay('open', 0);

        /* ★ Day 23：语音识别在这之后启动。
           为什么放在最后：开场白可能立刻就要发出去（8 主题），
           而 speakAiLine 里的 startListening 会等朗读结束才真正开始听 ——
           顺序对了就不会出现「AI 的话被当成你说的话」。
           ★ 识别不支持时不报错，页面继续用打字（降级）。 */
        if (SPEECH_OK) {
          /* ★★ 兜底：startListening 返回的是一个 Promise，
             它 resolve 的字符串才是**真实结果**（'ok' / 'denied' /
             'unsupported' / 'start-failed'…）。
             ★ 我原来的写法是「调了就不管」—— 万一它 resolve 成
               'denied'，页面依然一声不吭（用户报「完全没反应」）。
               现在把结果接过来：不是 'ok' 就明确说出来。
               这一层是防「钩子漏掉」，属于最后一道保险。 */
          window.Speech.startListening().then(function (r) {
            if (r && r !== 'ok' && r !== 'already' && r !== 'busy-speaking') {
              if (r === 'unsupported') {
                degradeToText('这个浏览器不支持语音识别。');
              } else if (r === 'denied') {
                degradeToText('麦克风没有授权。请点浏览器地址栏的小锁允许使用麦克风。');
              } else if (r === 'error') {
                degradeToText('麦克风打不开（可能没设备或被别的程序占用）。');
              }
              noteDiag('启动结果=' + r);
            } else {
              noteDiag('语音已启动');
            }
          });
        } else {
          noteSpeech('这个浏览器不支持语音识别，用下面的框写字也一样。', 0);
        }
        /* ★ Day 23 第五次修订：开跑前先报一遍环境。
           用户报「完全没反应」时，这一行能直接告诉我们在哪一步卡住，
           不用再来回问。 */
        /* ★★ Day 25：开新一场先把上一场的提示清空。
           不清的话，每点一次「开始说话」诊断段都会再追加一遍，
           提示区会一场比一场长（和瞬时提示无限追加是同一个根因）。 */
        clearSpeechNote();
        diagnose();
      });

      // 暂停 / 继续：只切换计时，不改轮次
      el.btnPause.addEventListener('click', function () {
        if (state === 'recording') {
          state = 'paused';
          stopTimer();
          clearSilence();     // 停表就连沉默一起停，别在暂停里冒出 AI 的一句
          /* ★ Day 23：暂停 = 别再听我说话了。
             不停的话你在暂停状态讲话，识别照样在转、转完还会自动提交——
             「暂停」就名存实亡了。 */
          if (SPEECH_OK) window.Speech.stopListening();
        } else if (state === 'paused') {
          state = 'recording';
          startTimer();
          /* ★ Day 23：继续后先把排队的处理掉。
             暂停前用户可能攒了几句在队列里，那些话他已经在记录区看得见，
             但还没得到回应 —— 继续对话就该先补上，不能装作没发生。
             队列不空就先 pump，armSilence 自己会在队列非空时直接返回。 */
          if (pendingQueue.length) {
            pumpQueue();
          } else {
            armSilence();     // 接着算：用户还没说话，AI 仍然会递话
          }
          /* 继续 = 再听。放在 pumpQueue 之后：
             若先启动识别，而 AI 正好要开口，识别会把 AI 的话当成用户的。 */
          if (SPEECH_OK) window.Speech.startListening();
        }
        /* ★ Day 23 二次修订：把焦点交回输入框。
           点「继续」的意图就是「我要接着说了」，但点按钮会把手柄带走 ——
           不拉回来的话，armSilence 刚排上 8 秒，用户还在想措辞就被催。
           必须放在 armSilence **之后**：focus 事件会 clearSilence，
           顺序反了会把刚排好的计时器清掉、倒计时再也不走。 */
        focusComposer();
        render();
      });

      // 结束对话 → 完成这一轮练习。
      // 只有真的走过这一轮（点过「开始说话」）才把该主题的练习次数 +1，
      // 一进页面就直接点结束不算练过，避免次数虚高。
      el.btnEnd.addEventListener('click', function () {
        stopTimer();
        /* 收尾时把两个计时器都停掉：不然在跳转出去之前，
           还可能弹出一句迟到的 AI 台词（用户已经按了结束）。 */
        clearSilence();
        if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
        /* ★ Day 23：结束对话必须把麦克风和朗读都关掉。
           漏掉任一个都会出事：
             漏识别 → 页面已经在跳了，麦克风还在听，
                      下一句你说的话会被记进这场已经结束的对话
             漏朗读 → 跳转之后还在念上一句，用户以为页面出问题了
           这两个都必须在 location.href **之前**做——
           跳转之后代码就不会执行了。 */
        if (window.Speech) {
          window.Speech.stopListening();
          window.Speech.stopSpeaking();
        }
        if (el.btnSkipSpeech) el.btnSkipSpeech.hidden = true;
        if (window.Storage && topicId && state !== 'idle') {
          rounds = window.Storage.bumpPracticeCount(topicId);
        }

        /* ★ Day 19：把整场转写交给结果页（它要拿去调 /api/analyze）。
           在跳转**之前**写 —— location.href 之后的代码不会执行。 */
        if (window.Storage) {
          var okSave = window.Storage.savePendingTranscript({
            topicId: topicId || '',
            transcript: transcriptTurns(null)      // 全量，不能像 chat 那样只取 6 轮
          });
          /* 存不进去（无痕模式/配额满）时不静默：结果页会因为读不到转写而
             显示「没找到这一场的对话内容」，那句话对用户毫无意义 ——
             真正的理由得在这儿说出来。反正马上就要跳走了。 */
          if (!okSave) { saveHint = 'transcript-not-saved=1'; }
        }

        var q = [];
        if (topicId) q.push('topic=' + encodeURIComponent(topicId));
        q.push('turns=' + rounds);
        q.push('dur=' + elapsed);
        /* 转写没存成的标记跟着走（只有一个短标记，不带内容）。
           结果页拿它把提示说清楚，而不是显示一句「没找到对话内容」。 */
        if (saveHint) q.push(saveHint);
        location.href = 'result.html?' + q.join('&');
      });

      /* 提交一句发言（Day 14 · F6 第 3 步）。
         ★ Day 23：原注释写的「本期用文本框代替开口，接入语音识别后这里一行都不用动」
           —— 语音已经接上了，**它确实一行都没改**：
           speech.js 把转写填进同一个输入框，再触发同一个 submit。
           这就是当初那个设计换来的好处。
顺序是刻意的：先让用户的话出现在记录区，再让 AI 延迟一点回应 ——
         反过来会变成 AI 抢在用户前面说话。

         ★ Day 23 修订：**不再丢用户说的话**。
           改之前第 3 行是 `if (CHAT_BUSY) return;` —— AI 等后端那3–8 秒里
           点提交，这一句被静默扔掉：不上屏、不清空、没提示。
           用户以为是自己没点到，反复点、反复被吞，这就是同伴说的
           「他没办法说话」里最直接的那一条。
           现在：先上屏（用户立刻看到自己说过了），再入队，
           AI 空闲时按顺序回应，队列长度显示在按钮上方。 */
      el.composer.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = (el.sayInput.value || '').trim();
        if (!text) return;               // 空的一句不算发言，也不重置沉默计时

        clearSilence();                  // 用户开口了，沉默计时停
        appendLine('user', text);
        turns += 1;
        hasUserSpoken = true;
        updateCount();
        el.sayInput.value = '';

        /* ★ userText 传下去：模型要看到用户**这一句**才谈得上「接话」。
           不传的话它只能泛泛追问，那和固定句库就没区别了。 */
        if (CHAT_BUSY) {
          /* AI 还在回上一句 → 排队，不打断它。
             为什么不当成「连续说话」把两句合并发一次：
             模型看到 user/assistant/user/assistant 的历史，
             只会把后一句当成对前一句的补充，而用户很可能
             说的是**另一个意思**（A2 水平的人常这样）。分开回更安全。 */
          pendingQueue.push(text);
          renderQueue();
          // 排队中不给 aiSay 加延迟：AI 是空出来的才轮到它，延迟只会让人多等
        } else {
          aiSay('reply', AI_DELAY_MS, { userText: text });
        }

        /* ★★ Day 23 二次修订：焦点**留在**输入框，不要留在按钮上。
           这是上一版剩下最大的一处漏洞，场景极常见：
           点「我说完了」→ 焦点被按钮带走 → AI 回应完armSilence 排上 8 秒
           → 用户这时正在想下一句怎么措辞，但焦点不在框里
           → userIsTyping() 判false → 8 秒后又被插一句。

           ★ 注意这里不要手动调armSilence：
             focusComposer 会触发 focus 事件，那个事件会 clearSilence ——
             结果是「本来该给的一轮倒计时被清掉了」，
             于是 blur 之前 AI 永远不开口（那比插嘴更糟）。
             此刻焦点已回框，userIsTyping() 返回 true 是**正确的**：
             他确实还在准备说。等他说完、焦点离开，blur 再起算。 */
        focusComposer();
      });

      // ---------- 主题名、职场角色、AI 台词池 ----------
      // 三样都来自同一份 topics.json：一次请求取完，不打三次。
      // 池子按模式装配（见文件开头 isFree 那段）：
      //   自由对话：silence = opening + openerPool；reply = replyPool
      //   8 主题　：open = opening；silence 与 reply **共用** followUpsEn
      //             （同一个对象、同一个游标，避免同一句被问两遍）
      if (topicId) {
        fetch('../../data/topics.json')
          .then(function (res) { return res.json(); })
          .then(function (topics) {
            var hit = topics.filter(function (t) { return t.topicId === topicId; })[0];
            nameEl.textContent = hit
              ? hit.name + '（' + topicId + '）'
              : topicId + '（主题数据里没有这个编号）';
            // 职场角色：拿到才显示，拿不到保持隐藏（不留空行）。
            // 自由对话没有 role 字段，所以这一行对它是天然不执行的。
            if (hit && hit.role) {
              roleEl.textContent = '你的角色：' + hit.role;
              roleEl.hidden = false;
            }
            if (!hit) return;

            /* ★ Day 18：把约束数据存起来，随请求带给 /api/chat。
               云函数读不到这份文件（它在静态目录里），
               所以 role / anchor / followUps 必须由前端传上去。
               FREE 没有这三项，TOPIC 保持空对象—— 云函数那边 FREE 本就不需要约束
               （F6 不判偏题，见 PRD §6.3）。 */
            TOPIC.role = hit.role || '';
            TOPIC.anchor = hit.anchor || '';
            TOPIC.followUps = hit.followUps || [];

            if (isFree) {
              pools.silence.lines = [hit.opening].concat(hit.openerPool || []).filter(Boolean);
              pools.reply.lines = (hit.replyPool || []).slice();
            } else {
              pools.open.lines = hit.opening ? [hit.opening] : [];
              /* 8 主题的追问：用 followUpsEn（AI 实际说出口的英语句子），
                 回退到 followUps（中文的「追问意图」）。
                 两个字段用途不同、都要留着 ——
                   followUps　 描述"该追问什么"，将来给 /api/chat 限定追问范围
                   followUpsEn 是台词语料，页面气泡里显示的就是它
                 （TECH_DESIGN.md §5.2 字段表）。
                 回退不是摆设：万一某条数据漏了 followUpsEn，页面会退回显示
                 中文意图句，而不是让 AI 一句话都不说（宁可难看，不能失语）。 */
              var lines = hit.followUpsEn && hit.followUpsEn.length
                ? hit.followUpsEn
                : (hit.followUps || []);
              var followUps = { lines: lines.slice(), at: 0 };
              pools.silence = followUps;
              pools.reply = followUps;
            }
          })
          .catch(function () {
            nameEl.textContent = topicId + '（主题数据没能加载）';
            // 池子取不到就靠 takeLine() 的兜底（TECH_DESIGN.md §8.2 E12）
          });
      }

      /* ★ Day 23：把语音接上（识别回调 + 跳过朗读按钮）。
         必须放在最后 —— 它要用到 el.recNote / el.btnSkipSpeech，
         而那些元素在本函数之前都已挂到 el 上。

         ★★ Day 23 第四次修订：把 bindSpeech 挂到 window.__rebind 上。
           为什么要暴露这个钩子：无头实测里要往window.Speech 注入假对象，
           而页面脚本早已跑完、回调挂在了真 Speech 上 → 换成假的之后回调就丢了。
           有了这个钩子，测试能重新接线，不必改被测代码。 */
      bindSpeech();
      window.__rebind = bindSpeech;

      /* ★ Day 23 二次修订：把三道闸挂上（focus / input / blur）。
         必须在函数定义之后、首次 render 之前调用。 */
      bindGuards();

      updateCount();
      render();
    })();
  </script>
</body>
</html>
