<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话结果 · 口语对话实战器</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <span class="brandtag">这次练得怎么样</span>
      <h1>会话结果</h1>
      <div>
        <a class="navlink" href="topics.html">回到主题列表</a>
        &nbsp;·&nbsp;
        <a class="navlink" href="records.html">查看错误记录 →</a>
      </div>
    </div>

    <!-- 面包屑（Day 13）· 层级约定见 TECH_DESIGN.md §4.3
         话题链：主题列表 › 对话 › 会话结果（三级）。
         为什么结果页是三级而不是一级：P2 → P3 是**顺着流程往下走**
         （对话结束才出结果），不是平级换页。面包屑照出实际的动线，
         用户看到三级就知道「我在对话的末尾」，而不是以为跳到了别处。 -->
    <nav class="breadcrumb" aria-label="面包屑导航">
      <a href="topics.html">主题列表</a>
      <span class="sep" aria-hidden="true">›</span>
      <a href="dialogue.html">对话</a>
      <span class="sep" aria-hidden="true">›</span>
      <span aria-current="page">会话结果</span>
    </nav>
    <p class="lede" id="topic-line">本次练习主题：（未选择主题）</p>

    <!-- 四个字段：昵称 / 对话时长 / 错误次数 / 精彩句子呈现次数（PRD.md §7.3 P3 要求）
         Day 10：对话时长改为读取对话页传来的真实秒数（?dur= ），未传参时仍显示 00:00。
         Day 14（F6 · 第 4 步）：错误次数与精彩句子次数**改为真算** —— 从本页渲染出来的
          条目里数条数（口径 PRD §8.3「错误次数 = 偏题条数 + 逻辑错误条数」、
          「精彩句子呈现次数 = 条数」）。自由对话下偏题条目已被剔除，
          所以这个式子自然退化成「错误次数 = 逻辑错误条数」，满足 B26。
          条目本身仍是本地假数据，这一层没有变。 -->
    <div class="card">
      <h2>本次数据</h2>
      <p class="hint" id="stat-hint">错误次数 = 本次问题条目的条数；精彩句子呈现次数 = 精彩句子条数。条目来自本地假数据。</p>
      <div class="field-grid">
        <div class="cell">
          <div class="label">昵称</div>
          <div class="value" id="f-nickname">你</div>
        </div>
        <div class="cell">
          <div class="label">对话时长</div>
          <div class="value" id="f-duration">00:00</div>
        </div>
        <div class="cell">
          <div class="label">错误次数</div>
          <div class="value" id="f-errors">0</div>
        </div>
        <div class="cell">
          <div class="label">精彩句子呈现次数</div>
          <div class="value" id="f-good">0</div>
        </div>
      </div>
    </div>

    <!-- 问题清单：偏题（只提醒）与逻辑错误（提醒 + 纠正）两类
         注意：偏题条目在本页面上「没有纠正那一格」是设计，不是缺漏（PRD.md §6.2）
         Day 11：改为由 data/mock-items.json 的手写条目渲染，条目上带收藏按钮（线 2-B）。
         真正的判断功能（AI 读用户原话生成条目）仍属第 3 周，本页的条目是假数据。
         Day 14（F6 · 第 4 步）：自由对话（?topic=FREE）下**这一类只剩逻辑错误** ——
          偏题条目不再渲染，且**页面上不出现「偏题」字样**（PRD §9.2 B25 比 §6.6 更严：
          不只是不显示条目，是连字样都不许有）。因此 hint 与空态文案都按 isFree 换一版。 -->
    <div class="card">
      <h2>问题清单</h2>
      <p class="hint" id="issue-hint">偏题只提醒、逻辑错误给纠正。判断功能尚未接入，下面是本地假条目。</p>
      <div class="item-list" id="issue-list" aria-live="polite">
        <div class="empty empty-solid">
          <div class="big">正在读取条目…</div>
        </div>
      </div>
      <div class="mock-bar" id="issue-mock"></div>
    </div>

    <!-- 精彩句子区 -->
    <div class="card">
      <h2>这次说得好的</h2>
      <p class="hint">这里的条数就是「精彩句子呈现次数」这个字段的值。</p>
      <div class="item-list" id="good-list" aria-live="polite">
        <div class="empty empty-solid">
          <div class="big">正在读取条目…</div>
        </div>
      </div>
    </div>

    <footer class="page-foot">
      口语对话实战器 · 会话结果页
    </footer>

  </div>

  <!-- 加载顺序（同 topics.html）：storage → interact → item-card → 页面逻辑 -->
  <script src="../js/storage.js"></script>
  <script src="../js/components/interact.js"></script>
  <script src="../js/components/item-card.js"></script>
  <script>
    // P3 结果页逻辑：
    //   ① 从地址栏取主题编号，在标题下方显示主题名
    //   ② Day 10：读取对话页传来的对话时长（?dur=秒数）并渲染成 mm:ss
    //   ③ Day 11：渲染问题清单与精彩句子（数据来自 data/mock-items.json 的假条目），
    //      并为每一条挂上收藏按钮（线 2-B）
    //   ④ Day 14（F6 · 第 4 步）：识别自由对话 —— 去掉偏题条目、页面不出现「偏题」字样、
    //      错误次数与精彩句子次数改为真算
    //
    // 口径以 PRD.md §6.2 / §6.4 / §6.6 / §8.3 为准：
    //   - 偏题条目**没有纠正那一格**，逻辑错误条目才有 —— 这是设计（§6.2 第 343 行）
    //   - 收藏对象就是这两类条目 + 精彩句子（§6.4 第 466 行）
    //   - 收藏状态存 localStorage（Storage.toggleFavorite）。Day 11 的清单要求
    //     「先使用前端临时状态，不接数据库」，但 PRD 的 A3 要求刷新后仍在，
    //     两者只能靠 Storage 兜住；第 3 周接库后这两个键迁走。
    //
    // 错误提示怎么演示：见下面 FAIL_MODE 的注释。

    (function () {
      var params = new URLSearchParams(location.search);
      var topicId = params.get('topic');
      var line = document.getElementById('topic-line');

      /* ---------- 自由对话（F6）判据 ----------
         `topicId === 'FREE'`，与对话页同一判据（TECH_DESIGN §5.2.1「决定 2」：
         不加 mode 字段）。它在本页带来三处差异（PRD §6.6、§7.3 P3、B25/B26）：
           ① 问题清单里不渲染偏题条目
           ② 页面上不出现「偏题」字样 —— 所以两处文案要换，不是简单少显示一类
           ③ 错误次数只由逻辑错误条目计算
         层次说明：TECH_DESIGN §6.3 第 3 条要求**后端在源头丢弃 off_topic 条目**。
         今天没有后端，所以先在前端拦一道，保证 B25 现在就验得了；
         接上后端后这一段过滤仍在（前端不假设上游一定干净）。 */
      var isFree = topicId === 'FREE';

      // 文案按模式换一版（②）：自由对话下「偏题」两个字都不能出现
      document.getElementById('stat-hint').textContent = isFree
        ? '错误次数 = 逻辑错误条数；精彩句子呈现次数 = 精彩句子条数。条目来自本地假数据。'
        : '错误次数 = 偏题条数 + 逻辑错误条数；精彩句子呈现次数 = 精彩句子条数。条目来自本地假数据。';
      document.getElementById('issue-hint').textContent = isFree
        ? '逻辑错误给纠正。判断功能尚未接入，下面是本地假条目。'
        : '偏题只提醒、逻辑错误给纠正。判断功能尚未接入，下面是本地假条目。';

      // ---------- 对话时长（秒 → mm:ss） ----------
      var durRaw = params.get('dur');
      if (durRaw !== null) {
        var secs = parseInt(durRaw, 10);
        if (!isNaN(secs) && secs >= 0) {
          var m = Math.floor(secs / 60), s = secs % 60;
          document.getElementById('f-duration').textContent =
            (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }
      }

      if (topicId) {
        fetch('../../data/topics.json')
          .then(function (res) { return res.json(); })
          .then(function (topics) {
            var hit = topics.filter(function (t) { return t.topicId === topicId; })[0];
            line.textContent = '本次练习主题：' + (hit ? hit.name + '（' + topicId + '）' : topicId);
          })
          .catch(function () {
            line.textContent = '本次练习主题：' + topicId + '（主题数据没能加载）';
          });
      }

      /* ============================================================
         收藏：失败路径怎么演示

         今天没有后端，所以「失败」得自己造一个。两种触发方式：
           ?favfail=1      收藏必定失败 —— 演示与截图时用这个，可控
           不带参数时      约 1/6 概率失败 —— 这样正常点击也能偶尔撞见错误提示，
                          不至于「这条提示永远看不到 = 验收不了」
         为什么要有随机失败：Day 11 的清单要求「发生错误时显示可理解的提示」，
         若失败路径永远走不到，这条要求就没有可观察的证据。
         （这是为达成清单要求加的演示开关，第 3 周接上真实请求后整段删掉。）
         ============================================================ */
      var FAIL_MODE = params.get('favfail') === '1';
      var FAV_DELAY_MS = 320;      // 与 topics.js 的 PIN_DELAY_MS 同值，交互手感一致

      function handleFavorite(next, api, item) {
        if (!window.Storage) {
          api.reject('这个浏览器不允许本地保存，收藏暂时用不了。');
          return;
        }

        setTimeout(function () {
          if (FAIL_MODE || (!FAIL_MODE && Math.random() < 1 / 6)) {
            api.reject('没能保存收藏，请再试一次。');
            return;
          }

          var ok = window.Storage.toggleFavorite(item.itemId, {
            type: item.type,
            topicId: topicId || ''
          });

          if (ok !== next) {
            api.reject('没能保存收藏，可能是浏览器不允许本地存储。');
            return;
          }
          api.resolve();
          /* 通知同页其他按钮照存储校正一次。
             本页多条条目各有一个按钮，将来若同一 itemId 出现两处（如加「收藏区」），
             这一句保证它们不会各说各话。组件侧的机制见 interact.js 的 sync()。 */
          document.dispatchEvent(new CustomEvent('ic-sync'));
        }, FAV_DELAY_MS);
      }

      /* ---------- 渲染条目 ---------- */
      function render() {
        fetch('../../data/mock-items.json', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            var all = data.items || [];
            /* 自由对话下先剔掉偏题条目（①）：F6 没有判定锚点，本来就不该判偏题
               （PRD §6.6 边界与约定第 1 条）。注意判据用的是 type 的**实现值**
               `'offtopic'`（见 mock-items.json 与 item-card.js）；
               TECH_DESIGN §5.3 的表里写的是 `"off_topic"`，两处取值不一致 —— **已报给用户待定**。 */
            var issues = all.filter(function (it) {
              if (it.type === 'good') return false;
              if (isFree && it.type === 'offtopic') return false;
              return true;
            });
            var goods = all.filter(function (it) { return it.type === 'good'; });

            /* 两个数字改为真算（PRD §8.3）：
                 错误次数 = 偏题条数 + 逻辑错误条数 —— 也就是上面 issues 的条数。
                   自由对话下偏题已被剔掉，这个式子自动退化成「= 逻辑错误条数」（B26）。
                 精彩句子呈现次数 = 精彩句子条数。
               条数取的是**本页真正渲染出来的条目**，不是另一份统计，
               这样屏幕上的清单和上面两个数字永远对得上。 */
            document.getElementById('f-errors').textContent = issues.length;
            document.getElementById('f-good').textContent = goods.length;

            var issueList = document.getElementById('issue-list');
            var goodList = document.getElementById('good-list');

            if (issues.length) {
              var f1 = document.createDocumentFragment();
              issues.forEach(function (it) {
                f1.appendChild(window.Components.item({ item: it, onToggle: handleFavorite }));
              });
              issueList.replaceChildren(f1);
            } else {
              // 真正的空态：判断结果确实为空时才出现（PRD.md §6.2 第 323 行）
              var e1 = document.createElement('div');
              e1.className = 'empty empty-solid';
              e1.appendChild(Object.assign(document.createElement('div'), {
                className: 'big',
                textContent: isFree ? '本次没有发现逻辑错误' : '本次没有发现偏题或逻辑错误'
              }));
              issueList.replaceChildren(e1);
            }

            if (goods.length) {
              var f2 = document.createDocumentFragment();
              goods.forEach(function (it) {
                f2.appendChild(window.Components.item({ item: it, onToggle: handleFavorite }));
              });
              goodList.replaceChildren(f2);
            } else {
              var e2 = document.createElement('div');
              e2.className = 'empty empty-solid';
              e2.appendChild(Object.assign(document.createElement('div'), {
                className: 'big', textContent: '本次还没有标记出精彩句子'
              }));
              goodList.replaceChildren(e2);
            }

            // 数据来源提示条（Day 11 临时，接真数据后删）
            document.getElementById('issue-mock').textContent =
              '以上 ' + issues.length + ' 条是本地假条目（data/mock-items.json），' +
              '不是你真练出来的。判断功能接入后会换成你的原话。';
          })
          .catch(function (err) {
            var box = document.getElementById('issue-list');
            var e = document.createElement('div');
            e.className = 'empty state-error';
            e.appendChild(Object.assign(document.createElement('div'), {
              className: 'big', textContent: '条目没能加载'
            }));
            e.appendChild(Object.assign(document.createElement('div'), {
              className: 'small',
              textContent: '（' + (err && err.message ? err.message : '') + '）' +
                '最常见的原因是直接双击打开了 HTML 文件——请用本地服务打开本页。'
            }));
            box.replaceChildren(e);
          });
      }

      render();
    })();
  </script>
</body>
</html>
