<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话结果 · 口语对话实战器</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <span class="brandtag">这次练得怎么样</span>
      <h1>会话结果</h1>
      <div>
        <a class="navlink" href="topics.html">回到主题列表</a>
        &nbsp;·&nbsp;
        <a class="navlink" href="records.html">查看错误记录 →</a>
      </div>
    </div>

    <!-- 面包屑（Day 13）· 层级约定见 TECH_DESIGN.md §4.3
         话题链：主题列表 › 对话 › 会话结果（三级）。
         为什么结果页是三级而不是一级：P2 → P3 是**顺着流程往下走**
         （对话结束才出结果），不是平级换页。面包屑照出实际的动线，
         用户看到三级就知道「我在对话的末尾」，而不是以为跳到了别处。 -->
    <nav class="breadcrumb" aria-label="面包屑导航">
      <a href="topics.html">主题列表</a>
      <span class="sep" aria-hidden="true">›</span>
      <a href="dialogue.html">对话</a>
      <span class="sep" aria-hidden="true">›</span>
      <span aria-current="page">会话结果</span>
    </nav>
    <p class="lede" id="topic-line">本次练习主题：（未选择主题）</p>

    <!-- 四个字段：昵称 / 对话时长 / 错误次数 / 精彩句子呈现次数（PRD.md §7.3 P3 要求）
         Day 10：对话时长改为读取对话页传来的真实秒数（?dur= ），未传参时仍显示 00:00。
         Day 14（F6 · 第 4 步）：错误次数与精彩句子次数**改为真算** —— 从本页渲染出来的
          条目里数条数（口径 PRD §8.3「错误次数 = 偏题条数 + 逻辑错误条数」、
          「精彩句子呈现次数 = 条数」）。自由对话下偏题条目已被剔除，
          所以这个式子自然退化成「错误次数 = 逻辑错误条数」，满足 B26。
         Day 19：条目本身**不再是本地假数据** —— 由 /api/analyze 读你这一场的原话生成，
          所以「四个字段」现在全是真值。 -->
    <div class="card">
      <h2>本次数据</h2>
      <p class="hint" id="stat-hint">错误次数 = 本次问题条目的条数；精彩句子呈现次数 = 精彩句子条数。</p>
      <div class="field-grid">
        <div class="cell">
          <div class="label">昵称</div>
          <div class="value" id="f-nickname">你</div>
        </div>
        <div class="cell">
          <div class="label">对话时长</div>
          <div class="value" id="f-duration">00:00</div>
        </div>
        <div class="cell">
          <div class="label">错误次数</div>
          <div class="value" id="f-errors">0</div>
        </div>
        <div class="cell">
          <div class="label">精彩句子呈现次数</div>
          <div class="value" id="f-good">0</div>
        </div>
      </div>
    </div>

    <!-- Day 27：写库结果提示条（复用 .mock-bar 样式，不新增 CSS）。
         放这里而不是问题清单卡片里：它说的是「整场练习有没有存下来」，
         是整页级别的事，不属于某一块的说明。 -->
    <div class="mock-bar" id="save-bar"></div>

    <!-- 问题清单：偏题（只提醒）与逻辑错误（提醒 + 纠正）两类
         注意：偏题条目在本页面上「没有纠正那一格」是设计，不是缺漏（PRD.md §6.2）
         Day 14（F6 · 第 4 步）：自由对话（?topic=FREE）下**这一类只剩逻辑错误** ——
          偏题条目不再渲染，且**页面上不出现「偏题」字样**（PRD §9.2 B25 比 §6.6 更严：
          不只是不显示条目，是连字样都不许有）。因此 hint 与空态文案都按 isFree 换一版。
         Day 19：条目改由 /api/analyze 从你这一场的原话生成（不再有本地假条目）。
          loading 那一态是**运行时**由 renderLoading() 填的，HTML 里只留一句兜底，
          这样即使脚本没跑起来，也不会让人以为「加载中」。 -->
    <div class="card">
      <h2>问题清单</h2>
      <p class="hint" id="issue-hint">偏题只提醒、逻辑错误给纠正。</p>
      <div class="item-list" id="issue-list" aria-live="polite">
        <div class="empty">
          <div class="big">正在读你这一场说过的话…</div>
        </div>
      </div>
      <div class="mock-bar" id="issue-mock"></div>
    </div>

    <!-- 精彩句子区 -->
    <div class="card">
      <h2>这次说得好的</h2>
      <p class="hint">这里的条数就是「精彩句子呈现次数」这个字段的值。</p>
      <div class="item-list" id="good-list" aria-live="polite"></div>
    </div>

    <footer class="page-foot">
      口语对话实战器 · 会话结果页
    </footer>

  </div>

  <!-- 加载顺序（同 topics.html）：storage → api → interact → item-card → 页面逻辑 -->
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components/interact.js"></script>
  <script src="../js/components/item-card.js"></script>
  <script>
    // P3 结果页逻辑：
    //   ① 从地址栏取主题编号，在标题下方显示主题名
    //   ② Day 10：读取对话页传来的对话时长（?dur=秒数）并渲染成 mm:ss
    //   ③ Day 11：渲染问题清单与精彩句子，并为每一条挂上收藏按钮（线 2-B）
    //   ④ Day 14（F6 · 第 4 步）：识别自由对话 —— 去掉偏题条目、页面不出现「偏题」字样、
    //      错误次数与精彩句子次数改为真算
    //   ⑤ Day 19：**条目改由真实会话产生** —— 从 storage 取出对话页传来的转写，
    //      调 POST /api/analyze 要判断结果，mock-items.json 已删除
    //
    // 口径以 PRD.md §6.2 / §6.4 / §6.6 / §8.3 为准：
    //   - 偏题条目**没有纠正那一格**，逻辑错误条目才有 —— 这是设计（§6.2 第 343 行）
    //   - 收藏对象就是这两类条目 + 精彩句子（§6.4 第 466 行）
    //   - 收藏状态存 localStorage（Storage.toggleFavorite）。第 3 周接库后迁走。
    //
    // 三个坑记在这里，改动时别踩回去：
    //   ① 转写是 take（取出即删），刷新本页会读不到 —— 这是故意的，
    //      宁可说「没有对话内容」也不能拿上一场的转写当本次结果展示。
    //   ② analyze 不给 itemId，收藏键由本页用 topicId-turn-type 编（见 itemIdOf）。
    //   ③ anchor 要等 topics.json 到位才能给，所以取数不是一条链而是两条 promise。

    (function () {
      var params = new URLSearchParams(location.search);
      var topicId = params.get('topic');
      var line = document.getElementById('topic-line');

      /* ---------- 自由对话（F6）判据 ----------
         `topicId === 'FREE'`，与对话页同一判据（TECH_DESIGN §5.2.1「决定 2」：
         不加 mode 字段）。它在本页带来三处差异（PRD §6.6、§7.3 P3、B25/B26）：
           ① 问题清单里不渲染偏题条目
           ② 页面上不出现「偏题」字样 —— 所以两处文案要换，不是简单少显示一类
           ③ 错误次数只由逻辑错误条目计算
         ★ 云函数已在服务端丢弃 FREE 下的 offtopic 条目（契约 §4 硬约束 3），
           但前端这一段过滤**仍保留**：前端不假设上游一定干净
           （换前端、加导出功能时它就漏出来了，api-contract §4 原话）。 */
      var isFree = topicId === 'FREE';

      /* ---------- 先取转写（**取 = 取出即删**）----------
         ★ 为什么必须在算 isFree / 换文案**之前**取：
           下面的 isFree、hint 文案、anchor 判定全都依赖 topicId，
           而 topicId 有两个来源（URL 与转写里带的）。先取转写才能保证
           后面所有分支看到的是同一个topicId —— 否则可能出现
           「按FREE 的文案渲染，却拿T1 的转写去问接口」这种自相矛盾。

           take 语义见 storage.js：**读一次就删**。刷新、手输地址、收藏夹打开
           本页都会读不到 —— 这是故意的。宁可显示「没有这一场的对话内容」，
           也不能拿上一场的转写当本次结果展示（那比空白危险得多）。*/
      var pending = window.Storage ? window.Storage.takePendingTranscript() : null;

      /* 主题以转写里带的为准：万一有人改了地址栏的 ?topic=，
         用 A 主题的转写去问 B 主题，读出来的东西会自相矛盾。
         转写里没有才信地址栏（此时按「没有对话内容」处理，见 render）。*/
      if (pending && pending.topicId) topicId = pending.topicId;
      isFree = topicId === 'FREE';

      /* 对话页写localStorage 失败时会带一个标记过来（无痕模式 / 配额满）。
         它的作用是**把原因说清楚** —— 否则用户只会看到「没有对话内容」，
         而那句话会让他以为是页面坏了。 */
      var NOT_SAVED = params.get('transcript-not-saved') === '1';

      /* ---------- 主题信息：名字 + 偏题判定依据 ----------
         Day 19 之前只需要 name；接了 /api/analyze 之后**还需要 anchor** ——
         8主题的偏题判定要有「主题是什么」的依据，而云函数读不到
         frontend/data/topics.json（那是静态目录里的文件），所以由前端随请求带上
         （同 /api/chat 的 role/anchor，理由见 api.js）。
         一次请求取完，name 与 anchor 一起拿。 */
      var TOPIC = null;
      var topicReady = false;   // topics.json 拿到没有（不管找没找到这个主题）

      function whenTopicReady(fn) {
        if (topicReady) { fn(TOPIC); return; }
        fetch('../../data/topics.json', { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (topics) {
            TOPIC = topics.filter(function (t) { return t.topicId === topicId; })[0] || null;
          })
          .catch(function () { TOPIC = null; })
          .then(function () { topicReady = true; fn(TOPIC); });
      }

      whenTopicReady(function (hit) {
        if (!topicId) return;
        if (hit) {
          line.textContent = '本次练习主题：' + hit.name + '（' + topicId + '）';
        } else if (isFree) {
          // FREE 不在 topics.json 里（自由对话本来就没有主题卡），这不是错误
          line.textContent = '本次练习主题：自由对话';
        } else {
          line.textContent = '本次练习主题：' + topicId + '（主题数据没能加载）';
        }
      });

      // 文案按模式换一版（②）：自由对话下「偏题」两个字都不能出现
      document.getElementById('stat-hint').textContent = isFree
        ? '错误次数 = 逻辑错误条数；精彩句子呈现次数 = 精彩句子条数。'
        : '错误次数 = 偏题条数 + 逻辑错误条数；精彩句子呈现次数 = 精彩句子条数。';
      document.getElementById('issue-hint').textContent = isFree
        ? '逻辑错误给纠正。'
        : '偏题只提醒、逻辑错误给纠正。';

      // ---------- 对话时长（秒 → mm:ss） ----------
      var durRaw = params.get('dur');
      if (durRaw !== null) {
        var secs = parseInt(durRaw, 10);
        if (!isNaN(secs) && secs >= 0) {
          var m = Math.floor(secs / 60), s = secs % 60;
          document.getElementById('f-duration').textContent =
            (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }
      }

      /* 收藏：失败路径怎么演示
         Day 19 起收藏**只写localStorage**（写库接口尚未做，PRD D5 路线乙数据在本机），
         没有网络请求可失败。所以原来那段「1/6 概率随机失败」的演示开关
         已随 mock 一起删除 —— 保留它就是**为了演示而制造假的失败**，
         而收藏这条路径本来就不该失败。
         ?favfail=1 现在什么也不做（本地存储不可用的情况仍会提示，见 handleFavorite）。 */
      var FAV_DELAY_MS = 320;      // 与 topics.js 的 PIN_DELAY_MS 同值，交互手感一致

      function handleFavorite(next, api, item) {
        if (!window.Storage) {
          api.reject('这个浏览器不允许本地保存，收藏暂时用不了。');
          return;
        }

        setTimeout(function () {
          var ok = window.Storage.toggleFavorite(item.itemId, {
            type: item.type,
            topicId: topicId || ''
          });
          if (ok !== next) {
            api.reject('没能保存收藏，可能是浏览器不允许本地存储。');
            return;
          }
          api.resolve();
          /* 通知同页其他按钮照存储校正一次。
             本页多条条目各有一个按钮，将来若同一 itemId 出现两处（如加「收藏区」），
             这一句保证它们不会各说各话。组件侧的机制见 interact.js 的 sync()。 */
          document.dispatchEvent(new CustomEvent('ic-sync'));
        }, FAV_DELAY_MS);
      }

      /* ---------- 条目编号：analyze 不给 itemId，前端自己编 ----------
         ★ 为什么需要编：收藏按钮的键就是 itemId（interact.js 的契约），
           而契约 §4 的 analyze 响应里**没有这个字段**（它要判的是「这句话有没有问题」，
           不需要编号；mock 里那三条的手写编号是给人看的）。
           键不存在 → toggleFavorite 拿到 falsy 直接 return false → 收藏永远点不动。

           编法：`topicId + '-' + turn + '-' + type`，如 `T1-3-logic`。
             为什么用 type 而不是只用到 turn：同一轮里既可能有逻辑错误
             又可能被夸成精彩句子（模型认为后半部分说得好），两个都要能独立收藏。
             为什么不用随机数/ 时间戳：要**稳定** —— 用户收藏后刷新页面，
             同一个键才能读回「已收藏」；随机键每次刷新都是新条目，收藏就丢了。

           ★ 已知局限（用户 Day 19 拍板接受）：同一主题的同一轮同类型条目
             在两场对话里会撞键 —— 收藏了上一场那场，这场同位置也显示已收藏。
             当前阶段无感（结果页只显示本次一场，条目也还没落库）；
             **接写入接口时必须改成真 sessionId + 序号**。 */
      function itemIdOf(it, type) {
        return (topicId || 'X') + '-' + (it.turn || 0) + '-' + type;
      }

      /* ---------- 四态：先把骨架摆出来 ----------
         本页的「加载中」比别的页长得多：要等模型把整场逐条判完
         （普遍 10–30 秒）。所以加载态必须**说清在做什么**，
         否则用户等十几秒看到「正在读取条目…」会以为页面坏了。 */
      function renderLoading() {
        var box = document.getElementById('issue-list');
        var e = document.createElement('div');
        e.className = 'empty';
        e.appendChild(Object.assign(document.createElement('div'), {
          className: 'big', textContent: '正在读你这一场说过的话…'
        }));
        e.appendChild(Object.assign(document.createElement('div'), {
          className: 'small', textContent: '接下来要逐条判断有没有偏题或前后矛盾，通常十几秒。'
        }));
        box.replaceChildren(e);
        // 精彩句子区此时没有内容，清掉上一轮可能残留的提示
        document.getElementById('good-list').replaceChildren();
      }

      function emptyBox(big, small) {
        var e = document.createElement('div');
        e.className = 'empty empty-solid';
        e.appendChild(Object.assign(document.createElement('div'), { className: 'big', textContent: big }));
        if (small) {
          e.appendChild(Object.assign(document.createElement('div'), { className: 'small', textContent: small }));
        }
        return e;
      }

      function renderError(big, small) {
        var e = document.createElement('div');
        e.className = 'empty state-error';
        e.appendChild(Object.assign(document.createElement('div'), { className: 'big', textContent: big }));
        if (small) {
          e.appendChild(Object.assign(document.createElement('div'), { className: 'small', textContent: small }));
        }
        document.getElementById('issue-list').replaceChildren(e);
      }

      /* ---------- 真正渲染条目 ----------
         issues / goods 是 analyze 已经映射好的展示层形态
         （quote / fix / typeLabel 都已翻好，见 api.js 的 mapItem）。 */
      function paint(issues, goods) {
        /* 两个数字真算（PRD §8.3）：
             错误次数 = 偏题条数 + 逻辑错误条数 —— 也就是上面 issues 的条数。
               自由对话下偏题已被剔掉，这个式子自动退化成「= 逻辑错误条数」（B26）。
             精彩句子呈现次数 = 精彩句子条数。
           条数取的是**本页真正渲染出来的条目**，不是另一份统计，
           这样屏幕上的清单和上面两个数字永远对得上。 */
        document.getElementById('f-errors').textContent = issues.length;
        document.getElementById('f-good').textContent = goods.length;

        var issueList = document.getElementById('issue-list');
        var goodList = document.getElementById('good-list');

        if (issues.length) {
          var f1 = document.createDocumentFragment();
          issues.forEach(function (it) {
            it.itemId = it.itemId || itemIdOf(it, it.type);
            f1.appendChild(window.Components.item({ item: it, onToggle: handleFavorite }));
          });
          issueList.replaceChildren(f1);
        } else {
          /* 真正的空态：判断结果确实为空时才出现（PRD §6.2第 323 行）。
             这与「没找到对话内容」是两件事 —— 后者是错态，上面分开画。 */
          issueList.replaceChildren(emptyBox(
            isFree ? '本次没有发现逻辑错误' : '本次没有发现偏题或逻辑错误',
            isFree ? '' : '下一场留意一下：有没有说到与主题无关的事。'));
        }

        if (goods.length) {
          var f2 = document.createDocumentFragment();
          goods.forEach(function (it) {
            it.itemId = it.itemId || itemIdOf(it, 'good');
            f2.appendChild(window.Components.item({ item: it, onToggle: handleFavorite }));
          });
          goodList.replaceChildren(f2);
        } else {
          goodList.replaceChildren(emptyBox('本次还没有标记出精彩句子'));
        }
      }

      /* ---------- Day 27：把这一场写进数据库 ----------
         ★ 为什么写在结果页、而不是点「结束对话」的那一刻：
           接口要的 `items` 来自 /api/analyze 的判断结果，而 analyze 是**这个页面**调的。
           在对话页写，就只能先写空 items 再想办法补 —— 两次写、还可能补不上。
           现在一次 POST 写全三张表（后端是「三步请求 + 补偿删除」，见契约 §4之一）。

         ★ 为什么不会重复写：转写是 take（取出即删），刷新之后读不到转写，
           render() 直接走「没有这一场的对话内容」，analyze 与写库都不会再跑；
           再加 SAVED 这个一次性开关，挡住同页面内的并发触发。

         ★ 写失败不阻塞看结果：条目照常显示，只提示「没存进库」。
           用户已经练完了，不能因为落库失败就连结果都不给看。 */
      var SAVED_ID = '';      // 首次生成后固定：重试沿用同一个 id，才能靠主键防重
      var SAVING = false;

      function newSessionId() {
        var d = new Date();
        function p2(n) { return (n < 10 ? '0' : '') + n; }
        var stamp = '' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) +
          p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
        /* 4 位随机后缀：同一秒连开两场也撞不上（真撞上会被主键拒，报 DUPLICATE） */
        return 'S-' + stamp + '-' + Math.random().toString(36).slice(2, 6);
      }

      function saveBar(text, warn) {
        var bar = document.getElementById('save-bar');
        if (!bar) return;
        bar.textContent = text;
        if (warn) bar.classList.add('mock-bar-warn');
        else bar.classList.remove('mock-bar-warn');
      }

      function saveSessionToDb(issues, goods) {
        if (SAVING) return;
        if (!pending || !pending.transcript || !pending.transcript.length) return;
        if (!window.Api || typeof window.Api.writeSession !== 'function') {
          saveBar('这一场没能存进数据库：页面脚本没加载成功（window.Api 缺失）。', true);
          return;
        }
        var startedAt = params.get('start') || '';
        var endedAt = params.get('end') || '';
        if (!startedAt) {
          /* 直接打开/老链接没有这两个参数。**不编一个时间糊过去** ——
             后端会按假时间算时长，库里就多一条「根本没发生过」的场次。
             所以直说为什么没存。 */
          saveBar('这一场没有存进数据库：地址里缺开始时间（不是从对话页走过来的）。', true);
          return;
        }

        if (!SAVED_ID) SAVED_ID = newSessionId();
        SAVING = true;

        window.Api.writeSession({
          sessionId: SAVED_ID,
          topicId: topicId || '',
          nickname: '',
          startedAt: startedAt,
          endedAt: endedAt,
          isComplete: true,
          /* 只挑接口认的两个字段：transcript 里的 timestamp / askedFollowUp 不传 ——
             少了不影响落库，多传了后端还要逐个校验。 */
          transcript: pending.transcript.map(function (t) {
            return { turn: t.turn, userText: t.userText, aiText: t.aiText || '' };
          }),
          /* items 映射：展示层用 quote / fix，接口要 type / reminder / correction。
             ★ 不传原句 —— 契约 §4之一 决定 2：后端按 turn 从 transcript 取回，
               前端塞的原句会被无视（B8「不编造原句」的保障就在这一层）。 */
          items: issues.concat(goods || []).map(function (it) {
            return {
              turn: it.turn || 0,
              type: it.type,
              reminder: it.reminder || '',
              correction: it.fix || ''
            };
          })
        }).then(function (r) {
          SAVING = false;
          var dropped = r.itemsDropped ? ('，另有 ' + r.itemsDropped + ' 条被规则丢弃') : '';
          saveBar('这一场已经存进数据库：' + r.turnsStored + ' 轮对话、' +
            r.itemsStored + ' 条问题/精彩句子' + dropped + '。去「错误记录」页能看到。');
          /* 把 sessionId 挂到地址上：刷新之后至少知道「哪一场存过」，
             比再看到一句「没有这一场的对话内容」有用。 */
          try {
            var u = new URL(location.href);
            u.searchParams.set('session', SAVED_ID);
            history.replaceState(null, '', u.toString());
          } catch (e) { /* 老浏览器没有 URL 构造器：不影响主流程 */ }
        }).catch(function (err) {
          SAVING = false;
          var why = (window.Api && window.Api.friendlyOf)
            ? window.Api.friendlyOf(err)
            : (err && err.message ? err.message : '');
          saveBar('这一场没能存进数据库：' + why +
            '（结果还能看，但刷新后就没了，记录页也不会有这一场）', true);
          /* 转写还在内存里，给一个重试入口；沿用同一个 sessionId，
             万一第一次其实写成功了（只是响应丢了），重试会拿到 DUPLICATE 而不是写两行。 */
          var bar = document.getElementById('save-bar');
          if (bar) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'ic-btn';
            btn.textContent = '重试保存';
            btn.style.marginLeft = '8px';
            btn.addEventListener('click', function () {
              btn.remove();
              saveSessionToDb(issues, goods);
            });
            bar.appendChild(btn);
          }
        });
      }

      /* ---------- 取转写 → 调 analyze → 渲染 ---------- */
      function render() {
        renderLoading();

        /* ① 转写已在页面开头取过（**必须**在算 isFree 之前，见上面注释） */
        if (!pending) {
          /* ★ Day 27：如果地址里带着 sessionId，说明这一场**已经存进库了** ——
             刷新看不到条目是因为条目只在「刚练完」那一刻现算一次（转写 take 的语义），
             不是数据丢了。这里必须把区别说清，否则用户会以为白练了。 */
          var sessParam = params.get('session');
          renderError('没有这一场的对话内容',
            sessParam
              ? '这一场（' + sessParam + '）已经存进数据库，刷新不会丢。' +
                '本页看不到条目，是因为条目只在刚练完那一刻现算一次；去「错误记录」页就能看到它。'
              : (NOT_SAVED
                ? '这个浏览器没能保存下这一场说的话（无痕模式或存储空间满时会这样），' +
                  '所以没法判断。换一个窗口再练一次就好。'
                : '本页要看的是你刚结束那一场说的话。请回到对话页练完再点「结束对话」。'));
          return;
        }

        /* ② anchor 要等 topics.json 拿到（偏题判定的依据，云函数读不到这个文件） */
        whenTopicReady(function (hit) {
          var anchor = (hit && !isFree) ? (hit.anchor || '') : '';

          window.Api.analyze({
            topicId: topicId || '',
            transcript: pending.transcript,
            anchor: anchor
          }).then(function (r) {
            /* FREE 下再滤一道 offtopic：云函数已在服务端强制丢弃（硬约束 3），
               这里留着是因为前端不假设上游一定干净。判据用实现值 'offtopic'
               （TECH_DESIGN §5.3 的表里写的 "off_topic" 与实现不一致，已报给用户待定）。 */
            var issues = r.issues.filter(function (it) {
              return !(isFree && it.type === 'offtopic');
            });
            paint(issues, r.goodSentences || []);

            /* Day 27：条目算出来了 → 把这一场写进库（一次 POST 落三张表）。
               放在 paint 之后：先让用户看到结果，落库慢一点不影响他阅读。
               analyze 失败（degraded）时 issues 是空数组，但**照样写** ——
               练习这件事确实发生了，sessions / turns 该留下，只是没有条目。 */
            saveSessionToDb(issues, r.goodSentences || []);

            /* 失败兜底：analyzeOrLocal 只在失败时返回 degraded。
               真成功时不写任何提示条 —— 页面上的条目本来就是你真练出来的，
               没有需要说明的来源问题（这一条是 Day 11 那条 mock 提示条的替代品）。*/
            if (r.degraded) {
              /* ★ Day 23：原来直接显示 r.errorCode（英文下划线大写，
                 比如 LLM_TIMEOUT / INTERNAL_ERROR），用户看不懂。
                 现在显示中文人话，errorCode 仍在控制台可查。 */
              var bar = document.getElementById('issue-mock');
              bar.textContent = '这次没能完成判断（' +
                ((window.Api && window.Api.friendlyOf)
                  ? window.Api.friendlyOf({ code: r.errorCode, message: r.errorMessage })
                  : (r.errorCode || '出了点问题，请再试一次')) +
                '），所以下面没有条目。';
              bar.classList.add('mock-bar-warn');
            } else {
              document.getElementById('issue-mock').textContent = '';
              document.getElementById('issue-mock').classList.remove('mock-bar-warn');
            }
          }).catch(function (err) {
            renderError('这次没能完成判断',
              /* ★ Day 23：原来把 err.message 直接拼进提示（英文码裸奔）。 */
              ((window.Api && window.Api.friendlyOf)
                ? window.Api.friendlyOf(err)
                : (err && err.message ? err.message : '出了点问题，请再试一次')) +
              ' 这一场的话已经存过了，你可以回到对话页再练一次。');
          });
        });
      }

      render();
    })();
  </script>
</body>
</html>
