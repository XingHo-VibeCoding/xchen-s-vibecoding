<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错误记录 · 口语对话实战器</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <span class="brandtag">你反复卡住的地方</span>
      <h1>错误记录</h1>
      <a class="navlink" href="topics.html">← 回到主题列表</a>
    </div>

    <!-- 面包屑（Day 13）· 层级约定见 TECH_DESIGN.md §4.3
         话题链：主题列表 › 错误记录。
         本页与 P2/P3 不同：记录是**跨会话**的（P4 把历次条目混排），
         不属于任何一场对话，所以话题链到二级就断 ——
         硬写成「主题列表 › 对话 › 错误记录」会是**假动线**，
         因为错误记录并不挂在某一场对话下面。 -->
    <nav class="breadcrumb" aria-label="面包屑导航">
      <a href="topics.html">主题列表</a>
      <span class="sep" aria-hidden="true">›</span>
      <span aria-current="page">错误记录</span>
    </nav>
    <p class="lede">这里汇总你历次练习里的问题条目，按时间倒序排列。</p>

    <!-- 筛选条（Day 12）· 口径见 PRD.md §7.4
         一个输入框同时筛下面两块（收藏区 + 全部条目），因为两块是同一份数据的
         两种排法。匹配 quote / fix / reminder / typeLabel / 主题名，大小写无关。
         label 用 .field 的「标签在上」纵向表单块，样式复用 main.css 的 .filter-bar。 -->
    <div class="filter-bar">
      <div class="field">
        <label for="flt-q">筛选条目</label>
        <input id="flt-q" type="search" autocomplete="off"
               placeholder="输入英文关键词，或中文意思（如「咖啡机」）"
               aria-describedby="flt-count">
      </div>
      <p class="filter-count" id="flt-count" role="status"></p>
    </div>

    <!-- 【Day 8 余力加练留下的接缝】主题卡片组件
         frontend/js/components/topic-card.js 是跨页面复用的组件（P1 正在用）。
         将来若在本页做「按主题归类」——把问题条目按所属主题分组、每组以主题卡开头——
         两步即可复用，不必再写一遍卡片：
           ① 在本页引入该组件文件（一行 script 标签，路径 ../js/components/topic-card.js）
           ② 调 Components.topicCard(topic, { stuck: true })，拿到卡片元素再 appendChild
         （本注释刻意不写出完整 script 标签字面量，否则「本页有几个 script 标签」这类
           正则检查会把注释里的示例也算进去。）
         但注意：本页的正式结构以 PRD.md §7.3 的 P4 一行为准（时间倒序的条目列表 + 收藏区 + 空状态），
         PRD 目前没有给 P4 定义「按主题归类」区块 —— 要加它得先改 PRD，不能只改代码。
         Day 8 拍板：只留接缝，本页今天不渲染任何东西。 -->

    <!-- 收藏区 -->
    <h2 class="section-title group-a">收藏区</h2>
    <div class="item-list" id="fav-list" aria-live="polite"></div>

    <!-- 全部条目 -->
    <h2 class="section-title group-b">全部条目</h2>
    <div class="item-list" id="all-list" aria-live="polite"></div>

    <!-- Day 27：初始就是 hidden。
         它现在只在「操作反馈」时才有内容（收藏/删除结果），
         不加 hidden 的话，从页面加载到首次 setBar() 之间会闪一条空色带
         —— 以前里面有文字，所以没人看得出来。 -->
    <div class="mock-bar" id="rec-mock" hidden></div>

    <!-- ★ Day 27：原来这里有一块「展开一条记录后应该看到什么」的静态说明卡
         （5 条：条目本身 / 提醒 / 纠正 / 所属会话 / 收藏与备注）。
         删掉的理由：它是**开发期的占位说明**，把内部规划直接摊给终端用户看，
         而这个项目已经不是演示阶段了。
         设计口径没丢 —— 那 5 条本来就在 `PRD.md` §7.3「展开一条记录后看到什么」（第 511 行），
         PRD 才是口径的真源，页面上不该再放一份副本。 -->

    <footer class="page-foot">
      口语对话实战器 · 错误记录页
    </footer>

  </div>

  <!-- 加载顺序（同 topics.html / result.html）：
       storage → interact → item-card → **api** → 页面逻辑
       api.js 插在 item-card 之后、页面逻辑之前：
       页面逻辑要调 window.Api，而 Api 只依赖 fetch，不依赖上面三个组件。 -->
  <script src="../js/storage.js"></script>
  <script src="../js/components/interact.js"></script>
  <script src="../js/components/item-card.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // P4 错误记录页逻辑（Day 11）：
    //   ① 按时间倒序列出历次会话的条目
    //   ② 收藏区：只列已收藏的条目，**按收藏时间倒序**（PRD.md §6.4 第 468 行）
    //   ③ 两处都能收藏 / 取消收藏，并且**改一处两处同时更新**
    //   ④ 筛选条（Day 12）：一个输入框同时筛两块，口径见 PRD.md §7.4
    //   ⑤ 四态开关（Day 13）：?state=loading / empty / error 三态可单独看，
    //     写法与 P1 的 topics.js:31 完全一致 —— 见下方「Day 13」注释
    //   ⑥ Day 19：删掉本地假条目兜底 —— 后端读不到就显示错误态，
    //     不用假数据把页面填满（理由见 render() 上方那段注释）
    //   ⑦ Day 22：每条记录带「删除」按钮，点一下先弹 window.confirm 二次确认，
    //     确认后才发 DELETE /api/sessions/write（见 handleDelete 上方那段注释）
    //
    // 跨页面同步怎么做的（口径：PRD.md §6.4 第 469 行「收藏状态跨页面同步」）
    //   收藏状态有**两份**：后端库的 items.is_favorited 与本机 localStorage
    //    （Storage 的 favoriteItems 键，还在用）。
    //   两份的关系：**后端那份是真相**，localStorage 只是在收藏按钮按下去、
    //   请求还没回来的那一瞬用来显示「已按下的样子」。
    //   ★★ Day 24 修：这段口径原先只是**写在注释里**，代码没照做 ——
    //      收藏只写 localStorage（Patch 接口 Day 22 建好了却没接上），
    //      收藏区又按 localStorage 算，于是清掉浏览器存储后
    //      「收藏区 0 条、而库里明明有收藏」。现在两处都真的按库来了：
    //        · 取数走 GET /api/items（契约 §6.1 R4，全部条目）
    //        · 收藏区 = 行上的 isFavorited（库真值）
    //        · 点收藏 → PATCH /api/sessions/write
    //
    // 本页与结果页的区别：
    //   结果页 = 本次会话（从待分析转写现算，见 result.html）
    //   本页   = 历次会话（sessions 数组）里的所有条目，跨会话混排

    (function () {
      var FAV_DELAY_MS = 320;

      /* ---------- Day 13：四种状态的开关 ----------
         与 P1（js/pages/topics.js:31）**同一套写法**，不另发明：
           pages/records.html                  成功（有数据）
           pages/records.html?state=loading    加载中
           pages/records.html?state=empty      空（跑完了，确实没有）
           pages/records.html?state=error      错误

         为什么用地址栏参数而不是页面里放个调试下拉框：
           ① 能截图（打卡要求图里必须有地址栏）；
           ② 能复现 —— 别人照着同样的地址打开，看到的是同一屏；
           ③ 不用在正式界面上挂一个只给开发看的控件。

         为什么本页的「加载中」原来做不到：Day 11 时两个列表的加载文案是
         **写死在 HTML 里**的（<div class="empty">正在读取记录…</div>），
         那是「还没拿到数据时的默认内容」，不是一种能被单独检视的状态。
         现在改成由 renderLoading() 渲染 —— 拿到数据的路径统一走 paint()，
         两处不再各写一份。 */
      var FORCED = new URLSearchParams(location.search).get('state') || 'success';

      var favList = document.getElementById('fav-list');
      var allList = document.getElementById('all-list');
      var countEl = document.getElementById('flt-count');
      var mockBar = document.getElementById('rec-mock');

      /* ---------- Day 27：这条说明条退化成「操作反馈条」 ----------
         ★ 删掉了什么（都是开发语言，不该出现在产品界面上）：
           · 成功态：「以上 N 条来自后端数据库。收藏与删除都会写回数据库；…」
           · 空态　：「空态：本页已经取到数据，只是数据里一条记录也没有。」
           · 错误态：「错误态：…错误码 DB_XXX…；地址栏是 file://…看 F12 的 Network。」
         ★ 为什么能删：
           有/没数据，两块列表自己说得清（空态有「还没有任何记录」+ 一句怎么才会有的指引）；
           读失败，renderError 那块已经写了原因还给了按钮。说明条再抄一遍是重复且更难懂。
         ★ 保留什么：**操作反馈**（已收藏 / 已删除 / 没删掉）——
           那是用户点了按钮之后必须知道的结果，不能没有。
         ★ 排错信息去哪了：`console.warn`。需要它的人会开 F12，不需要的人不该看见。
         ★ 统一走 setBar()：只清 textContent 不隐藏的话，空 div 仍占着那条色带的位置。 */
      function setBar(text, warn) {
        if (!mockBar) return;
        mockBar.textContent = text || '';
        mockBar.hidden = !text;
        if (warn) mockBar.classList.add('mock-bar-warn');
        else mockBar.classList.remove('mock-bar-warn');
      }

      /* ---------- 加载中（Day 13新增） ----------
         用 P1 同款的骨架卡：.skeleton-grid / .skeleton-card / .bar.w40|w70|w100
         样式全部已在 main.css 里（P1 在用），**本页不新增任何 CSS**。
         为什么骨架卡比「正在读取…」一句话好：列表有多长事先不知道，
         骨架按真实条数占位，页面不会在数据到达时突然往下跳一屏。 */
      function renderLoading() {
        [favList, allList].forEach(function (host) {
          var grid = document.createElement('div');
          grid.className = 'skeleton-grid';
          for (var i = 0; i < 3; i++) {
            var card = document.createElement('div');
            card.className = 'skeleton-card';
            ['w40', 'w70', 'w100', 'w100'].forEach(function (w) {
              var bar = document.createElement('div');
              bar.className = 'bar ' + w;
              card.appendChild(bar);
            });
            grid.appendChild(card);
          }
          host.replaceChildren(grid);
        });
        countEl.textContent = '正在读取…';
      }

      /* ---------- 筛选相关（Day 12） ----------
         为什么要缓存 + 分「重取」与「重画」两层：
           筛选是**纯前端**的（数据已经在内存里），每敲一个字就重新向后端要一遍
           属于把简单事做复杂，还会打断输入。
           所以 render() 只在首次/收藏变化时取数据并缓存 rows，
           输入关键词时走 paint() —— 只重画，不重取。
           （这与 checks.md §收藏同步是同一个思路：状态一份，视图现场算。）

         match() 为什么用「全部字段拼成一段小写文本」而不是逐字段判断：
           五个字段任一命中即为匹配，逐字段写是五遍几乎相同的 indexOf；
           拼起来一次includes 就够，且加字段时只要往数组里加一项。
           小写化放在 match 里做，调用方传原始关键词即可。 */
      var CACHE = { rows: null };      // 首次 fetch 之后存下来
      var KEY = '';                    // 当前筛选词（小写、已trim）

      /* 参与匹配的字段。口径见 PRD.md §7.4 的字段表：
         quote 原句（英文）/ fix 纠正（英文）/ reminder 提醒（中文）/
         typeLabel 类型（中文）/ 所属主题名与编号（中文）。 */
      function match(row, key) {
        if (!key) return true;                 // 空关键词 = 全部显示
        var it = row.item || {};
        var hay = [
          it.quote, it.fix, it.reminder, it.typeLabel,
          row.topicName, row.topicId
        ].join(' ').toLowerCase();
        return hay.indexOf(key) !== -1;
      }

      function paint(rows) {
        var hitAll = rows.filter(function (r) { return match(r, KEY); });

        // ---------- 全部条目（时间倒序 + 筛选） ----------
        if (hitAll.length) {
          var f = document.createDocumentFragment();
          hitAll.forEach(function (r) { f.appendChild(recordRow(r)); });
          allList.replaceChildren(f);
        } else if (KEY) {
          // 筛过了但一条没命中 → 实线框：这是「跑完了、结果确实为空」
          allList.replaceChildren(notFoundBox());
        } else {
          allList.replaceChildren(emptyBox(
            '还没有任何记录', '完成一次练习之后，这里会按时间倒序列出你的问题条目。'));
        }

        /* ---------- 收藏区（**按收藏时间倒序**，不是按会话时间） ----------
           两次排序的差别：全部条目按会话时间排，收藏区按「你什么时候标的」排。
           所以同一屏里两块的顺序可能不同 —— 这是对的，PRD §6.4 第 468 行
           要求收藏区「最近标的在最上面」。

           ★ Day 24 修：判据从「本机存储」改成「**库里的 is_favorited**」。
             原来用 Storage.favoriteIds() 排，而本页显示的数据来自库 ——
             两份状态一旦不一致（清过浏览器存储、换设备、无痕窗口），
             收藏区就会与「共 N 条」对不上，最极端的情形是
             收藏区 0 条而库里全是收藏（Day 24 复现的就是这一条）。
             现在直接按行上的 isFavorited 算，与页面显示的数据同源；
             排序按 favoritedAt 倒序（库里那列，PATCH 时由接口层连带维护）。 */
        var favRows = rows
          .filter(function (r) { return !!(r.item && r.item.isFavorited); })
          .sort(function (a, b) {
            return String(b.item.favoritedAt || '')
              .localeCompare(String(a.item.favoritedAt || ''));
          })
          .filter(function (r) { return match(r, KEY); });

        if (favRows.length) {
          var f2 = document.createDocumentFragment();
          favRows.forEach(function (r) { f2.appendChild(recordRow(r)); });
          favList.replaceChildren(f2);
        } else if (KEY) {
          favList.replaceChildren(notFoundBox());
        } else {
          favList.replaceChildren(emptyBox(
            '还没有收藏任何条目', '在会话结果页对某一条点「收藏」，它就会出现在这里。'));
        }

        // 计数行：让用户分得清「没找到」与「本来就没有」—— 前者有筛选词，后者没有
        var favHit = favRows.length;
        countEl.textContent = KEY
          ? '显示 ' + (hitAll.length + favHit) + ' / 共 ' + rows.length + ' 条（收藏区 ' +
            favHit + ' 条）· 关键词「' + KEY + '」'
          : '共 ' + rows.length + ' 条（收藏区 ' + favHit + ' 条）';
      }

      /* 收藏：**写库**（Day 24 修）
         -------------------------------------------------------------
         ★ 修的是什么：原来这里只调 window.Storage.toggleFavorite（本机存储），
           而本页的数据源是后端库、库里那份才是真相（口径见本文件顶部那段）。
           后果是「清掉浏览器存储后收藏区空空如也，而库里的收藏还在」——
           同一屏里「共 N 条」与「收藏区 M 条」两个数字长期对不上。
         ★ 接口 Day 22 就建好了（api.js 的 patchItem），只是从没接上。

         为什么还保留 FAV_DELAY_MS 那点延迟：interact.js 的状态机需要一个
         「处理中」的可见瞬间（它自己有 MIN_BUSY_MS=350ms 的下限），
         320ms 是按下与结果之间的呼吸，不是网络延迟 —— 真正的等待由
         按钮的 busy 态承担。 */
      function handleFavorite(next, api, item) {
        if (!window.Api || typeof window.Api.patchItem !== 'function') {
          api.reject('页面脚本没加载成功（window.Api 缺失），收藏没能保存。');
          return;
        }
        var want = (next === true);

        setTimeout(function () {
          window.Api.patchItem(item.itemId, { isFavorited: want }).then(function (res) {
            /* ★ 用**接口回读的真值**改本地缓存，不是把 want 原样写上去 ——
               接口层 PATCH 之后自己又查了一次库（契约 §4.2），
               并发下别人可能也改过同一条，重画的必须是库里的状态。
               ★ 改缓存必须在 api.resolve() 之前：interact.js 的 resolve()
               会回头再问一次数据源（item-card 的 pressed 函数读的正是
               这里这个 isFavorited），顺序反了按钮会显示旧状态。 */
            var saved = res && res.item ? res.item : null;
            if (CACHE.rows) {
              CACHE.rows.forEach(function (r) {
                if (r.item && r.item.itemId === item.itemId) {
                  r.item.isFavorited = saved ? saved.isFavorited : want;
                  if (saved) r.item.favoritedAt = saved.favoritedAt;
                }
              });
            }

            /* localStorage 退居二线：只在「按下那一瞬」做同页即时显示
               （口径见本文件顶部）。这里失败也**不该**让整次操作失败 ——
               真相已经写进库了，本机存储只是那一瞬的视觉过渡。 */
            try {
              if (window.Storage && window.Storage.isFavorite &&
                  window.Storage.isFavorite(item.itemId) !== want) {
                window.Storage.toggleFavorite(item.itemId, {
                  type: item.type, topicId: item.topicId || ''
                });
              }
            } catch (e) { /* 存储不可用不影响结果：库已经改了 */ }

            api.resolve();
            /* 先通知同页按钮校正，再重算两个列表。
               顺序不能反：本页同一个 itemId 会在「收藏区」和「全部条目」各出现一次，
               若不先通知，重渲染前那一瞬两块会显示不一致的状态。 */
            document.dispatchEvent(new CustomEvent('ic-sync'));
            // 收藏状态变了 → 两个列表都要重算（收藏区可能多一条、也可能少一条）
            if (CACHE.rows) paint(CACHE.rows);
            setBar(want
              ? '已收藏，这条的状态已写回数据库。'
              : '已取消收藏，这条的状态已写回数据库。');
          }).catch(function (err) {
            /* 失败：库里的状态**没变**。页面也不该显示改过 —— 直接 reject，
               interact.js 会照数据源把按钮拨回原位，并把这句原因显示在卡片上。 */
            var why = (window.Api && window.Api.friendlyOf)
              ? window.Api.friendlyOf(err)
              : (err && err.message ? err.message : '');
            if (window.console && console.warn) {
              console.warn('[records] 收藏没存上', (err && err.code) || 'UNKNOWN');
            }
            setBar('收藏没保存上：' + why, true);
            api.reject('没能保存收藏：' + why);
          });
        }, FAV_DELAY_MS);
      }

      /* ---------- Day 22：删除一条（+ 二次确认）----------
         -------------------------------------------------------------
         ★★ 今天的正题：删除为什么比新增更容易出事？
           新增写错一条 → 库里多一行，GET 列表里多一条，用户看得见、也能顺手删掉。
           删除写错一次 → 真删的话，那一行**当场消失**，没有撤销、没有历史、没有痕迹。
           所以这条路径上做了三道确认（后端那两道见云函数 handleDeleteItem）：

           ① **前端二次确认**（就是这一段）：点「删除」先弹 window.confirm，
              把要删的那句原话摆进提示语里。用户连点两下的习惯很常见 ——
              弹窗挡住的不是「故意删」，是「手快」。
           ② **后端先查存在性**，不存在的 id 回 404 + 中文说明，不回「删除成功」
           ③ **标记之后再查一次**（后端做的，最容易被省掉也最该保留）

         ★ 为什么用**原生 window.confirm**（用户 Day 22 拍板）：
           一是不动 main.css（新增一个自造的确认弹窗要写样式 + 过视觉规范），
           二是浏览器原生弹窗自带「焦点陷阱 + Esc 取消 + 回车确定」——
              自造的弹窗这三条都要自己实现，漏一条就是无障碍缺陷。
           代价：样式不可控、按钮文案不能改（只能用「确定/取消」）。
           在这个项目里这笔交易划算 —— 删除是用户看不见后果的操作
           （对页面来说它消失了，但用户不知道背后发生了什么），
           「让人在一眼能看完的地方明确按一下」比「好看」重要。

         ★★ 文案里**必须带上要删的原句**，不能只写「确定删除吗？」：
           列表是混排的（历次会话的条目按时间倒序堆在一起），
           用户看按钮旁边那张卡片才知道是哪一条，而 confirm 一弹出来
           视线就被移走了。写上原句，确认这件事才真的做得到。

         ★★★ 余力加练之后（Day 22 同日做的软删除）：这里三处文案都改过了。
           原来写「删了就找不回来了」「那一行已经没有了」——
           软删之后**行还在库里**，只打了 is_deleted 标记，
           对外口径必须跟着改，否则就是**在说一件假事**（用户 Day 22 拍板
           「契约与文案同步说明」）：
             · confirm     「删了就找不回来了」→「不会再出现在记录里」
             · 成功说明「那一行已经没有了，找不回来」→「不会再出现在记录里」
             · 页面底部「删掉的条目找不回来」→「不会再出现在记录里」
           ★ 页面仍然不该说「可以恢复」之类的话 ——
             恢复接口本期没做（只留了库里的口子），说了就是骗用户点一个不存在的功能。 */
      function handleDelete(item, btn) {
        if (!window.Api || typeof window.Api.deleteItem !== 'function') {
            setBar('删除失败：页面脚本没加载成功（window.Api 缺失）。', true);
          return;
        }
        var quote = (item.quote || '').trim();
        var brief = quote.length > 60 ? quote.slice(0, 60) + '…' : quote;
        var confirmed = window.confirm(
          '删掉这一条吗？删了它就不会再出现在记录里了。\n\n' +
          '「' + brief + '」\n第 ' + (item.turn || '?') + ' 轮 · ' + (item.typeLabel || ''));
        if (!confirmed) return;      // 用户点了「取消」：连请求都不该发

        /* 请求期间把按钮 disabled 掉防连点。
           ★ 为什么不靠 interact.js 那套busy 锁：那个组件是为开关型动作写的，
             删除是一次性的，删完这条数据就没了，「再取一次真值」无从取起。
             这里直接用原生 disabled —— 一行就够，不需要一套状态机。 */
        if (btn) btn.disabled = true;

        window.Api.deleteItem(item.itemId).then(function () {
          /* 成功：本地缓存里去掉这一条，再重画两块列表。
             为什么改缓存而不是重新取数：刚才那份 rows 就是后端刚给的真值，
             只少了一条，重取一次是白花一次网络往返 + 一帧加载态。 */
          dropFromCache(item.itemId);
          /* ★ 收藏状态也要一起清掉 —— 否则这一条会继续占着收藏区的位置，
             而 GET /api/favorites 下次取数时它已经不在库里了，
             结果是收藏区里挂着一张空卡片（byId 查不到 → 会被 .filter 掉，
             眼下看不出坏，但状态是脏的：用户再收藏别的就会看到它莫名出现又消失）。 */
          if (window.Storage && window.Storage.isFavorite && window.Storage.isFavorite(item.itemId)) {
            window.Storage.toggleFavorite(item.itemId, {
              type: item.type, topicId: item.topicId || ''
            });
          }
          document.dispatchEvent(new CustomEvent('ic-sync'));
          if (CACHE.rows) {
            if (CACHE.rows.length === 0) renderEmpty(); else paint(CACHE.rows);
          }
          /* 只说做了什么，不解释后端返回了哪些字段 ——
             那份 data 是给排错用的，页面文案用不着（也不该依赖它的形状）。 */
          setBar('已删掉 1 条记录，它不会再出现在记录里。');
        }).catch(function (err) {
          /* ★★ 这里必须分两种失败说两句话（无头实测发现的原来那版是错的）。
             原来一律写「这条记录还在页面上，可以再试一次」——
             但后端回 404 NOT_FOUND 时，它的意思恰恰是「**库里已经没有这一条了**」
             （多半是另一个页面先删了，或刷新前就被删过）。
             那时这条卡片是**幽灵**：再点一百次还是同样的 404，
             「可以再试一次」是在骗用户做一件注定失败的事。

             所以按错误码分开处理：
               404 NOT_FOUND → 它已经不在库里了 → **把这条从列表里拿掉**（页面跟库里对齐）
               其他          → 网络/读库/权限之类 → 按钮恢复，文案说可以重试
             ★ 判据用 err.code（api.js 已按契约把 body.error.code 挂上来），
               不去匹配 message 里的中文 —— 文案会改，码不会。 */
          if (btn) btn.disabled = false;

          if (err && err.code === 'NOT_FOUND') {
            dropFromCache(item.itemId);
            if (window.Storage && window.Storage.isFavorite &&
                window.Storage.isFavorite(item.itemId)) {
              window.Storage.toggleFavorite(item.itemId, {
                type: item.type, topicId: item.topicId || ''
              });
            }
            document.dispatchEvent(new CustomEvent('ic-sync'));
            if (CACHE.rows) {
              if (CACHE.rows.length === 0) renderEmpty(); else paint(CACHE.rows);
            }
            setBar('这一条已经在库里没有了（可能刚才在别的页面删掉了），所以把它从列表里去掉了。');
            return;
          }

          /* ★ Day 23：原来这里是 '没能删掉：' + err.message ——
             err.message 是接口层的原始原因，删一条不存在的条目时
             它可能是 `HTTP 404` 或 `INTERNAL_ERROR`，用户看不懂。
             现在走 Api.friendlyOf()拿中文人话。 */
          setBar('没能删掉：' +
            ((window.Api && window.Api.friendlyOf)
              ? window.Api.friendlyOf(err)
              : (err && err.message ? err.message : '出了点问题，请再试一次')) +
            '　—— 这条记录还在，可以再试一次。', true);
        });
      }

      /* 从缓存里去掉一条并重画两块列表。
         为什么单独抽一个函数：成功删除与「404 → 其实早没了」两条路径
         要做**完全相同**的四件事（改缓存 / 清收藏 / 通知同页 / 重画），
         写成两遍的话将来改一处漏一处，就会出现「删完卡片还在」的怪现象。 */
      function dropFromCache(itemId) {
        if (!CACHE.rows) return;
        CACHE.rows = CACHE.rows.filter(function (r) {
          return r.item.itemId !== itemId;
        });
      }

      // 会话时间显示成「9 月 28 日 20:15」这种，不显示秒
      function fmtTime(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return iso || '';
        var hh = d.getHours(), mm = d.getMinutes();
        return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' +
          (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
      }

      /* 渲染一条「记录」：条目本身 + 一行「所属主题 · 时间」。
         与结果页的区别就在这行归属信息 —— 记录页跨会话，不标归属用户会不知道
         这条是哪次说的（PRD §7.3 P4 明确要求「所属主题与时间」）。 */
      function recordRow(row) {
        var box = document.createElement('div');
        /* ★ onDelete 只在记录页传（结果页不传，所以那边不会出现删除按钮 ——
           理由见 item-card.js 里那段注释）。
           同一个 itemId 在本页会出现两次（收藏区 + 全部条目），
           两张卡片各自带自己的按钮，删掉任一张后 CACHE.rows 重画，
           两块都会一起少掉这一条 —— 不需要额外的同步代码。 */
        box.appendChild(window.Components.item({
          item: row.item,
          onToggle: handleFavorite,
          onDelete: handleDelete
        }));
        var meta = document.createElement('div');
        meta.className = 'item-src';
        meta.textContent = row.topicName + '（' + row.topicId + '） · ' + fmtTime(row.at);
        box.appendChild(meta);
        return box;
      }

      function emptyBox(title, small) {
        var e = document.createElement('div');
        e.className = 'empty';
        var big = document.createElement('div');
        big.className = 'big';
        big.textContent = title;
        e.appendChild(big);
        if (small) {
          var s = document.createElement('div');
          s.className = 'small';
          s.textContent = small;
          e.appendChild(s);
        }
        return e;
      }

      /* 「筛选跑完了、一条没命中」的空态—— 与「本来就没有记录」区分开：
         前者是确定的结论（筛过了，确实没有）→ 实线框 .empty-solid；
         后者表示「这条还没接上」→ 虚线框 .empty。
         口径见 PRD.md §7.4 末段，与 main.css 里 .empty-solid 的注释同源。 */
      function notFoundBox() {
        var e = emptyBox('未找到', '换个关键词试试，或清空输入框看全部条目。');
        e.className = 'empty empty-solid';
        return e;
      }

      /* render 只做两件事：取一次数据、缓存起来、交给 paint。
         筛选词变化时不走这里（见paint 上方注释）。
         Day 13：开头按 ?state= 分发四态，末尾的错误分支改走 renderError()。*/
      function render() {
        // 先摆出加载态：真实取数期间用户看到的是骨架屏，不是一片空白
        renderLoading();

        // 要看「加载中」这一态就停在这里，不再往下走
        if (FORCED === 'loading') return;

        /* ---------- Day 17：数据来源从「只有本地 mock」改成「后端优先」----------
         Day 19：**mock 兜底整段删除**。原来是「后端成功用真数据、失败用假条目」，
         现在只有一条路 —— 后端。理由：假条目会让用户把
         「我没说过的话」当成自己的记录看，而那正是这个产品最不该出的错
         （契约 §4 硬约束 1 的同一条底线）。

         所以后端读不到时，本页显示**错误态并说清原因**，
         而不是渲染几条编出来的记录把页面填满。
         ★ 这个取舍是有代价的：写库接口做出来之前，历次记录本来就是空的
         （PRD D5 路线乙「数据存在本机」，用户练出来的记录还在 localStorage 里，
         没进过库）。空白 + 一句「读不到」比「看着像真的」诚实。
         ------------------------------------------------------------------ */

        /* 条目走后端（契约 §6.1 R4 的 GET /api/items）
           ★★ Day 24 修：这里原先是 getFavoritesOrLocal（那个接口**只返已收藏的**），
             而本页「全部条目」要的是全部 —— 于是没收藏过的条目一条都显示不出来。
             证据：库里 7 条 items、只收藏了 3 条，页面却写「共 2 条」。
             契约 §6.1 R4 早就登记了这个接口，只是一直没实现，记录页就借用了收藏接口。
           ★ 用 OrLocal 版而不是 getItems —— 后者失败时会 **reject**，
             而这里是 Promise.all，一旦有一个 reject 整个 then 都不走，
             直接掉进 catch 的错误态，页面变成「记录没能加载」。
             那正是 api.js 头注释约定 ② 要避免的事：接口一挂，页面不该空。
             OrLocal 把失败转成 { items: [], degraded: true, errorCode }，
             下游用 degraded 标志决定显示什么。 */
        var itemsPromise = window.Api
          ? window.Api.getItemsOrLocal({ limit: 100 }, [])
          : Promise.resolve(null);

        /* sessions 单独取：items 与 sessions 是两张表，
           R4 只给条目本身，还要用 sessions 补出「所属主题名与时间」。
           同理用 OrLocal：sessions 拿不到不该连累 items。 */
        var sessionsPromise = window.Api
          ? window.Api.getSessionsOrLocal({ limit: 100 }, [])
          : Promise.resolve(null);

        Promise.all([itemsPromise, sessionsPromise])
          .then(function (r) {
            var remoteItems = r[0];
            var remoteSessions = r[1];

            /* Day 13 补：强制空态（与成功态的区别是**数据先真的取到了**再决定显示空）。
               ?state=empty  请求成功但一条记录也没有；
               notFoundBox() 请求成功、有数据，只是筛选词没命中。*/
            if (FORCED === 'error') throw new Error('演示用：强制错误状态');

            /* 后端读不到（凭据/表缺失/超时/网络问题）→ 错误态。
               这一条现在**直接落到 renderError**，不再退回假条目。
               ⚠️ 旧注释里举的 DB_CONNECTION_REFUSED 这个码 Day 18 就删掉了
               （改走 HTTP API 后既没有 TCP 连接可拒、也没有 PGHOST 要解析），
               现役的 DB 类是 DB_AUTH_FAILED / DB_TABLE_MISSING / DB_TIMEOUT /
               DB_QUERY_FAILED —— 见契约 §1.4。 */
            if (remoteItems && remoteItems.degraded) {
              /* ★ Day 23：原来直接传 errorMessage（接口层原始原因，
                 可能是英文码），现在翻成中文人话。
                 注意 getItemsOrLocal 挂在结果上的字段是
                 errorCode / errorMessage，这里要拼成 err 形状给
                 friendlyOf —— 它只读 .code 与 .message 两个键。 */
              renderError(
                (window.Api && window.Api.friendlyOf)
                  ? window.Api.friendlyOf({ code: remoteItems.errorCode,
                                            message: remoteItems.errorMessage })
                  : (remoteItems.errorMessage || ''),
                { code: remoteItems.errorCode });
              return;
            }
            if (!remoteItems) {
              renderError('NO_API', '这一页要访问后端取记录，但页面脚本没加载成功。');
              return;
            }

            var rows = rowsFromRemote(remoteItems.items,
              remoteSessions ? remoteSessions.sessions : []);

            if (rows.length === 0 || FORCED === 'empty') {
              CACHE.rows = rows;
              renderEmpty();
              return;
            }

            CACHE.rows = rows;
            paint(rows);

            /* Day 27：原来这里写「以上 N 条来自后端数据库。收藏与删除都会写回数据库…」——
               数据从哪来是**实现细节**，用户不需要知道，删。 */
            setBar('');
          })
          .catch(function (err) {
            /* ★ Day 23：原来直接显示 err.message（英文码裸奔）。 */
            renderError((window.Api && window.Api.friendlyOf)
              ? window.Api.friendlyOf(err)
              : (err && err.message ? err.message : ''),
              { code: err && err.code });
          });
      }

      /* ---------- 把后端的两张表拼成本页要的「一行一条目」 ----------
         页面的渲染逻辑要的是 { item, sessionId, topicName, topicId, at } 一行一条目，
         而后端给的是 sessions 数组 + items 数组两张表。
         ★ items 刻意带了 topic_id 冗余（api-contract §9.5），所以**不用 join**
           sessions 就能知道每条属于哪个主题；只有「主题中文名」要从 sessions 带出来，
           拿不到就退回显示编号——主题名在 topics.json 里，接口查不到不是缺陷。 */
      function rowsFromRemote(items, sessions) {
        var byId = {};
        (sessions || []).forEach(function (s) { byId[s.sessionId] = s; });

        var rows = (items || []).map(function (it) {
          var s = byId[it.sessionId];
          return {
            item: it,
            sessionId: it.sessionId,
            topicId: it.topicId,
            /* 主题中文名的来源：库里没有 topics 表（TECH_DESIGN §5.2
               已定主题只在 topics.json 里维护），所以这里拿到的是编号。
               拿不到名字时退回编号—— 不编造一个名字出来。 */
            topicName: (s && s.topicId) || it.topicId,
            at: it.createdAt
          };
        });

        rows.sort(function (a, b) {
          return (Date.parse(b.at) || 0) - (Date.parse(a.at) || 0);
        });
        return rows;
      }

      /* ---------- 空态（Day 13 补：可单独看） ----------
         两块分别给文案，因为它们的空**含义不同**：
           收藏区空 = 还没收藏过任何条目（这是 F4 的正常起点，不是缺数据）
           全部条目空 = 一次练习都还没做（这时该去 P1 挑个主题）
         原来这两种空只有真实发生时才看得到，现在能单独检视。 */
      function renderEmpty() {
        favList.replaceChildren(emptyBox(
          '还没有收藏任何条目', '在会话结果页对某一条点「收藏」，它就会出现在这里。'));
        allList.replaceChildren(emptyBox(
          '还没有任何记录', '完成一次练习之后，这里会按时间倒序列出你的问题条目。'));
        countEl.textContent = '共 0 条（收藏区 0 条）';
        /* Day 27：原来这里写「空态：本页已经取到数据，只是数据里一条记录也没有。」
           ——「空态」是开发术语，而且上面两块已经各自写了「还没有任何记录」，
           说明条再重复一遍只会更绕。 */
        setBar('');
      }

      /* ---------- 错误态（Day 13 抽出，Day 19 扩成两种） ----------
         现在有两种到达方式，说法必须不同：
           ① 后端读接口返回 degraded（DB_CONNECTION_REFUSED 等）——
              这是**当前环境的已知状态**（体验版没有 VPC 权限，详见 api-contract §2.1），
              重试没用，得升级套餐，所以按钮换成「回到主题列表」而不是「重新加载」
           ② 其它异常（网络抖动、页面被双击打开）—— 重新加载有可能就好 */
      function renderError(detail, opts) {
        var o = opts || {};
        /* ★★ Day 23修一个静默失效的判断。
           原来是 (o.code === 'DB_CONNECTION_REFUSED') || (o.code === 'DB_ERROR')，
           而这两个码**Day 18 已经删掉了**（见 api-contract §1.4 的删除说明）
           —— 代码里现在实际发的是 DB_QUERY_FAILED / DB_AUTH_FAILED /
           DB_TABLE_MISSING / DB_TIMEOUT。
           后果：这个判断恒为false，「后端暂时读不到记录」那条分支
           **永远进不去**，所有数据库故障都被说成「页面本身没问题」，
           而这句在双击打开 HTML 时才成立 —— 方向完全说反了，用户按提示
           去检查本地服务，白折腾。

           ★ 为什么改成**前缀判断**而不是把四个码逐个列出来：
             今天修的正是「逐个列 → 新增一个就漏掉一个」这个病。
             DB_ 前缀已经是本项目约定好的分类（api-contract §1.4 按前缀分），
             跟着前缀走，以后新增 DB 码自动归到这一支。 */
        var backendsDown = (typeof o.code === 'string') &&
          (o.code.indexOf('DB_') === 0 || o.code === 'LLM_NOT_CONFIGURED');

        /* ★★ Day 24 余力加练修：else 这一支原来**无条件断言**失败原因，
           一律写「最常见的原因是直接双击打开了 HTML 文件」。
           ★ 而今天真实发生的恰恰相反：新加的网关路由 `/api/items` 没开**跨域设置**，
             浏览器按 CORS 拦掉了请求（错误码落到兜底的 UNKNOWN）。
             用户明明是用本地服务打开的，页面却让他去查本地服务 —— 方向说反、白折腾。
           ★ 这与上面那段注释（686-699）描述的是**同一个病**：
             当时只改了 DB 那一支的判断，else 支的文案没跟着改，于是病留在了这里。
           ★ 修法：只说**能当场验证的事**。`file://` 是可以当场判的 →
             是 file:// 才提「双击打开」；否则不指认原因，只给可执行的动作。 */
        var viaFile = (location.protocol === 'file:');

        var msg = emptyBox(
          backendsDown ? '后端暂时读不到记录' : '记录没能加载',
          (backendsDown
            ? '你的练习记录存在服务器上，而当前环境连不上数据库（' + (detail || '未知原因') + '）。'
            : '数据没读上来。' +
              (detail ? '（' + detail + '）' : '') +
              (viaFile
                ? '最常见的原因是直接双击打开了 HTML 文件——请用本地服务打开本页。'
                : '先点「重新加载」再试一次；若一直这样，按 F12 看 Network 里那条请求的结果。')));
        msg.className = 'empty state-error';

        var btn = document.createElement('button');
        btn.className = 'primary';
        /* 后端连不上时不给「重新加载」：点了也是同一个错误，
           白白让用户以为是自己操作的问题。换成一条能真的走出去的路。 */
        btn.textContent = backendsDown ? '回到主题列表' : '重新加载';
        btn.style.marginTop = '16px';
        btn.addEventListener('click', function () {
          /* 去掉地址栏上的 ?state= 再来 —— 否则又落回被强制出来的状态 */
          location.href = backendsDown ? 'topics.html' : location.pathname;
        });
        msg.appendChild(btn);

        favList.replaceChildren(
          emptyBox('收藏也读不到', '记录要先从服务器取回来，收藏是从里面筛出来的。'));
        allList.replaceChildren(msg);
        countEl.textContent = '没能读到记录';
        /* 这一条是**开发提示条**（#rec-mock），给排错用 —— 所以这里保留错误码：
           今天就是因为只剩一句「页面本身没问题」，把「CORS 拦了请求」这个真因
           完全盖住了。留一个码，打开控制台就知道往哪查。 */
        /* ★ Day 27：界面上不再出现「错误态：…错误码 …；看 F12 的 Network」这类开发语言。
           renderError 那块已经写清了原因（并给了「重新加载」/「回到主题列表」按钮），
           这里不再重复。排错要的错误码走控制台。 */
        if (window.console && console.warn) {
          console.warn('[records] 记录读失败', o.code || 'UNKNOWN', detail || '');
        }
        setBar('', true);
      }

      // 筛选输入：改 KEY → 只重画，不重取。
      // 用 'input' 事件而不是 'change'/'keyup'：后者在粘贴、鼠标选中删除、
      // 手机输入法上屏时都不触发，'input' 这三种情况都会触发。
      var input = document.getElementById('flt-q');
      input.addEventListener('input', function () {
        KEY = input.value.trim().toLowerCase();
        if (CACHE.rows) paint(CACHE.rows);
      });

      render();
    })();
  </script>
</body>
</html>
