<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错误记录 · 口语对话实战器</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <h1>错误记录</h1>
      <a class="navlink" href="topics.html">← 回到主题列表</a>
    </div>
    <p class="lede">这里汇总你历次练习里的问题条目，按时间倒序排列。</p>

    <!-- 【Day 8 余力加练留下的接缝】主题卡片组件
         frontend/js/components/topic-card.js 是跨页面复用的组件（P1 正在用）。
         将来若在本页做「按主题归类」——把问题条目按所属主题分组、每组以主题卡开头——
         两步即可复用，不必再写一遍卡片：
           ① 在本页引入该组件文件（一行 script 标签，路径 ../js/components/topic-card.js）
           ② 调 Components.topicCard(topic, { stuck: true })，拿到卡片元素再 appendChild
         （本注释刻意不写出完整 script 标签字面量，否则「本页有几个 script 标签」这类
           正则检查会把注释里的示例也算进去。）
         但注意：本页的正式结构以 PRD.md §7.3 的 P4 一行为准（时间倒序的条目列表 + 收藏区 + 空状态），
         PRD 目前没有给 P4 定义「按主题归类」区块 —— 要加它得先改 PRD，不能只改代码。
         Day 8 拍板：只留接缝，本页今天不渲染任何东西。 -->

    <!-- 收藏区 -->
    <h2 class="section-title group-a">收藏区</h2>
    <div class="item-list" id="fav-list" aria-live="polite">
      <div class="empty">
        <div class="big">正在读取收藏…</div>
      </div>
    </div>

    <!-- 全部条目 -->
    <h2 class="section-title group-b">全部条目</h2>
    <div class="item-list" id="all-list" aria-live="polite">
      <div class="empty">
        <div class="big">正在读取记录…</div>
      </div>
    </div>

    <div class="mock-bar" id="rec-mock"></div>

    <!-- 展开一条记录后应该看到什么，先写成静态说明，等人真的点开时再实现 -->
    <div class="card card-spaced">
      <h2>展开一条记录后应该看到什么</h2>
      <p class="hint">下面列出这一块将来会包含的内容，功能接入后按此结构展示。</p>
      <ul class="spec-list">
        <li>条目本身：类型（偏题 / 逻辑错误）· 出现在第几轮 · 原句</li>
        <li>提醒：偏题说明偏离了主题哪一点；逻辑错误说明哪里不成立</li>
        <li>纠正：<b>只有逻辑错误条目有</b>，偏题条目没有这一格</li>
        <li>所属那次会话：主题名 · 时间 · 对话时长 · 当次错误次数与精彩句子条数</li>
        <li>收藏状态与备注内容</li>
      </ul>
    </div>

    <footer class="page-foot">
      口语对话实战器 · 错误记录页
    </footer>

  </div>

  <!-- 加载顺序（同 topics.html / result.html）：
       storage → interact → item-card → 页面逻辑 -->
  <script src="../js/storage.js"></script>
  <script src="../js/components/interact.js"></script>
  <script src="../js/components/item-card.js"></script>
  <script>
    // P4 错误记录页逻辑（Day 11）：
    //   ① 按时间倒序列出历次会话的条目（数据来自 data/mock-items.json 的假条目）
    //   ② 收藏区：只列已收藏的条目，**按收藏时间倒序**（PRD.md §6.4 第 468 行）
    //   ③ 两处都能收藏 / 取消收藏，并且**改一处两处同时更新**
    //
    // 跨页面同步怎么做的（口径：PRD.md §6.4 第 469 行「收藏状态跨页面同步」）
    //   收藏状态只有一份，存在 localStorage（Storage 的 favoriteItems 键）。
    //   本页渲染时**从这一份状态现场算出两个列表**，而不是各存一份 ——
    //   在结果页收藏的条目，打开本页时自然就在收藏区里，不需要任何同步机制。
    //   这也是为什么取消收藏后能立刻从收藏区消失：重算一遍即可。
    //
    // 本页与结果页的区别（由 mock 数据的结构决定）：
    //   结果页 = 本次会话的 items
    //   本页   = 历次会话（sessions 数组）里的所有条目，跨会话混排

    (function () {
      var FAV_DELAY_MS = 320;

      /* 本页没有 ?favfail 这种演示开关，失败只来自真实原因（浏览器不允许本地存储）。
         为什么不做随机失败：本页是「回看」场景，用户在检查自己的收藏是否还在，
         这时随机报错会造成「我的收藏丢了」的误解 —— 演示用的随机失败只放在
         结果页（写入的那一刻），回看页保持诚实。 */
      function handleFavorite(next, api, item) {
        if (!window.Storage) {
          api.reject('这个浏览器不允许本地保存，收藏暂时用不了。');
          return;
        }
        setTimeout(function () {
          var ok = window.Storage.toggleFavorite(item.itemId, {
            type: item.type,
            topicId: item.topicId || ''
          });
          if (ok !== next) {
            api.reject('没能保存收藏，可能是浏览器不允许本地存储。');
            return;
          }
          api.resolve();
          /* 先通知同页按钮校正，再重算两个列表。
             顺序不能反：本页同一个 itemId 会在「收藏区」和「全部条目」各出现一次，
             若不先通知，重渲染前那一瞬两块会显示不一致的状态。 */
          document.dispatchEvent(new CustomEvent('ic-sync'));
          // 收藏状态变了 → 两个列表都要重算（收藏区可能多一条、也可能少一条）
          render();
        }, FAV_DELAY_MS);
      }

      // 把 mock 数据摊平成「历次会话的所有条目，按时间倒序」，
      // 并给每条补上所属会话信息（本页每条要显示所属主题与时间，PRD §7.3 P4）
      function flatten(data) {
        var rows = [];
        var sessions = (data.sessions || []).slice();

        // 第一段 session（当前那次）+ sessions 数组，合成一张会话表
        if (data.session) {
          sessions.push({
            sessionId: data.session.sessionId,
            topicId: data.session.topicId,
            topicName: data.session.topicName,
            at: data.session.at,
            durationSec: data.session.durationSec,
            items: data.items || []
          });
        }

        sessions.forEach(function (s) {
          (s.items || []).forEach(function (it) {
            rows.push({
              item: it,
              sessionId: s.sessionId,
              topicName: s.topicName,
              topicId: s.topicId,
              at: s.at
            });
          });
        });

        // 时间倒序：最近的在最上面（PRD.md §6.5 第 487 行）
        rows.sort(function (a, b) {
          return (Date.parse(b.at) || 0) - (Date.parse(a.at) || 0);
        });
        return rows;
      }

      // 会话时间显示成「9 月 28 日 20:15」这种，不显示秒
      function fmtTime(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return iso || '';
        var hh = d.getHours(), mm = d.getMinutes();
        return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' +
          (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
      }

      /* 渲染一条「记录」：条目本身 + 一行「所属主题 · 时间」。
         与结果页的区别就在这行归属信息 —— 记录页跨会话，不标归属用户会不知道
         这条是哪次说的（PRD §7.3 P4 明确要求「所属主题与时间」）。 */
      function recordRow(row) {
        var box = document.createElement('div');
        box.appendChild(window.Components.item({ item: row.item, onToggle: handleFavorite }));
        var meta = document.createElement('div');
        meta.className = 'item-src';
        meta.textContent = row.topicName + '（' + row.topicId + '） · ' + fmtTime(row.at);
        box.appendChild(meta);
        return box;
      }

      function emptyBox(title, small) {
        var e = document.createElement('div');
        e.className = 'empty';
        var big = document.createElement('div');
        big.className = 'big';
        big.textContent = title;
        e.appendChild(big);
        if (small) {
          var s = document.createElement('div');
          s.className = 'small';
          s.textContent = small;
          e.appendChild(s);
        }
        return e;
      }

      function render() {
        fetch('../../data/mock-items.json', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            var rows = flatten(data);
            var favList = document.getElementById('fav-list');
            var allList = document.getElementById('all-list');

            // ---------- 全部条目（时间倒序） ----------
            if (rows.length) {
              var f = document.createDocumentFragment();
              rows.forEach(function (r) { f.appendChild(recordRow(r)); });
              allList.replaceChildren(f);
            } else {
              allList.replaceChildren(emptyBox(
                '还没有任何记录', '完成一次练习之后，这里会按时间倒序列出你的问题条目。'));
            }

            /* ---------- 收藏区（**按收藏时间倒序**，不是按会话时间） ----------
               两次排序的差别：全部条目按会话时间排，收藏区按「你什么时候标的」排。
               所以同一屏里两块的顺序可能不同 —— 这是对的，PRD §6.4 第 468 行
               要求收藏区「最近标的在最上面」。顺序由 Storage.favoriteIds() 给。 */
            var favOrder = window.Storage ? window.Storage.favoriteIds() : [];
            var byId = {};
            rows.forEach(function (r) { byId[r.item.itemId] = r; });

            var favRows = favOrder
              .map(function (id) { return byId[id]; })
              .filter(function (r) { return !!r; });   // 收藏了但列表里没有的忽略掉

            if (favRows.length) {
              var f2 = document.createDocumentFragment();
              favRows.forEach(function (r) { f2.appendChild(recordRow(r)); });
              favList.replaceChildren(f2);
            } else {
              favList.replaceChildren(emptyBox(
                '还没有收藏任何条目', '在会话结果页对某一条点「收藏」，它就会出现在这里。'));
            }

            document.getElementById('rec-mock').textContent =
              '以上 ' + rows.length + ' 条是本地假条目（data/mock-items.json），' +
              '不是你真练出来的。收藏状态存在本机浏览器里，刷新后仍在。';
          })
          .catch(function (err) {
            var box = document.getElementById('all-list');
            var e = emptyBox('记录没能加载',
              '（' + (err && err.message ? err.message : '') + '）' +
              '最常见的原因是直接双击打开了 HTML 文件——请用本地服务打开本页。');
            e.className = 'empty state-error';
            box.replaceChildren(e);
          });
      }

      render();
    })();
  </script>
</body>
</html>
