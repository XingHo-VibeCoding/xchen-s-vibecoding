<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主题列表 · 口语对话实战器</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="wrap">

    <!-- 页头（全宽）：项目名 + 去错误记录入口（PRD.md §7.3 P1 必现信息） -->
    <div class="topbar">
      <h1>口语对话实战器</h1>
      <a class="navlink" href="records.html">查看错误记录 →</a>
    </div>
    <!-- 面包屑（Day 13）· 层级约定见 TECH_DESIGN.md §4.3
         位置在 .topbar 之下、.lede 之上（.lede 的border-bottom 是页头的收口线，
         面包屑放在线以上才算"页头的一部分"）。
         P1 是**根**，自己就是当前位置，所以**整条只有一项、不带分隔符**。
         这不是「省略了」，是根节点该有的样子：面包屑回答「我在哪」，
         根页面没有上一级可指。强行写成「首页 › 主题列表」会多出一级
         指向自己、点了等于不动的层级。 -->
    <nav class="breadcrumb" aria-label="面包屑导航">
      <span aria-current="page">主题列表</span>
    </nav>

    <p class="lede">
      选一个主题开始练习。AI 会扮演你的同事或上司，当场问你，不迁就你——
      说含糊了它追问，说到一半停住它不替你补完。
    </p>

    <!-- 主视图：单列堆叠，视觉顺序由 CSS 的 order 决定，始终与编号小标 01 → 04 一致 -->
    <div class="layout">

      <!-- 这一层只用于归类，不生成盒子（样式里是 display: contents）：
           四个区块直接参与外层栅格，靠 order 排成 01 → 04。
           .col-side 里装的是 01 与 04（首尾两块），中间两块是 .layout 的直接子元素；
           分组不影响排布 —— display: contents 让它不生成盒子。 -->
      <div class="col-side">

        <!-- ============ 区块 1｜开始之前：怎么称呼你 ============ -->
        <!-- 出处：PRD.md §7.3 P1「昵称输入（首次进入时）」、§8.1 字段① -->
        <section class="card blk-identity">
          <p class="eyebrow">01 · 开始之前</p>
          <h2>怎么称呼你</h2>
          <p class="hint">填了之后，练习记录里就用这个名字称呼你。不填也能用，页面会用「你」称呼。</p>
          <div class="field">
            <label for="nickname">昵称</label>
            <input id="nickname" type="text" placeholder="例如：小陈" autocomplete="off">
          </div>
          <!-- 开发期提示（不再渲染给用户看）：输入框已就位，但保存要等
               localStorage 逻辑接上（见 TECH_DESIGN.md §5.7）——今天只做页面渲染。
               Day 10：原为 .placeholder-note 段落，会把内部文档编号显示给终端用户，
               现改为 HTML 注释；该类已随之删除。 -->
        </section>

        <!-- ============ 区块 4｜你的卡点概览 ============ -->
        <!-- 出处：PRD.md §4.1 H3「它在盯着我的弱点」、§8.3 错误次数口径、§7.3 P1 记录页入口 -->
        <section class="card blk-overview">
          <p class="eyebrow">04 · 你的卡点</p>
          <h2>你被卡住的地方</h2>
          <div class="blk-body" id="overview-body" aria-live="polite"></div>
        </section>

      </div>

      <!-- ============ 区块 2｜自由对话（F6） ============ -->
      <!-- 出处：PRD.md §6.6（定义）、§7.3 P1（必现入口）、§9.2 B23（独立入口） -->
      <!-- 位置（Day 14 修订，用户拍板）：由「8 个主题之后的列表末尾」提到「8 个主题之上」，
           编号 02。这条假设的版式落点（原定在 8 个主题之后）已随本次修订，
           见 PRD.md §4.1 H4「H4 在版式上的落点」。 -->
      <!-- hidden 由 topics.js 在渲染出自由对话条目后移除：这一节的内容是数据驱动的
           （topics.json 里 group="自由" 的那一条）。读不到数据 / 数据里没有这一条时，
           整节连同小标一起不出现，不留一个底下没内容的空编号。 -->
      <section class="blk-free" id="block-free" hidden>
        <p class="eyebrow">02 · Free talk</p>
        <!-- 自由对话入口由 topics.js 渲染在这里（它不再是主题列表里的一项） -->
        <div id="free-slot" aria-live="polite"></div>
      </section>

      <!-- ============ 区块 3｜选一个主题（页面主内容，通栏铺满整行） ============ -->
      <!-- 出处：PRD.md §6.3 主题清单、§9.2 B12 / B13 -->
      <section class="blk-topics">
        <div class="blk-head">
          <div>
            <p class="eyebrow">03 · 选一个主题</p>
            <h2>职场即兴英语对话</h2>
          </div>
          <p class="blk-note">8 个主题都属于这一个场景</p>
        </div>

        <!-- 四种状态（加载中 / 成功 / 空 / 错误）都由 topics.js 渲染在这里 -->
        <div class="topics-body" id="topics-body" aria-live="polite">
          <noscript>
            <div class="empty">
              <div class="big">这个页面需要 JavaScript 才能显示主题</div>
              <div class="small">请在浏览器里允许本页运行脚本，然后刷新。</div>
            </div>
          </noscript>
        </div>
      </section>

    </div>

    <footer class="page-foot">
      口语对话实战器 · 主题列表页 · 当前数据为本地假数据（mock）
    </footer>

  </div>

  <!-- 加载顺序有讲究，三层从下往上依赖，顺序不能换：
         ① storage.js   —— localStorage 的唯一出口（TECH_DESIGN.md §4.2 规矩 2）
         ② interact.js  —— 会反馈的按钮组件，topic-card.js 要用它造星标
         ③ topic-card.js—— 主题卡片组件，topics.js 要用它造卡片
         ④ topics.js    —— 本页逻辑，最后加载
       任何一步提前都会拿到 undefined（组件是可复用的，别的页面要加同一行）。 -->
  <script src="../js/storage.js"></script>
  <script src="../js/components/interact.js"></script>
  <script src="../js/components/topic-card.js"></script>
  <script src="../js/pages/topics.js"></script>
</body>
</html>
