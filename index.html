<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>口语对话实战器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #fafafa;
      color: #24292f;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      max-width: 560px;
      width: 100%;
      padding: 40px 32px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #57606a;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .status {
      border-left: 3px solid #d8dee4;
      padding: 12px 0 12px 16px;
      font-size: 14px;
      color: #57606a;
    }

    .status strong {
      color: #24292f;
      font-weight: 600;
    }

    hr {
      border: none;
      border-top: 1px solid #eaeef2;
      margin: 24px 0;
    }

    footer {
      font-size: 13px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>口语对话实战器</h1>
    <p class="subtitle">用于练习英语口语的网页工具</p>

    <div class="status">
      <strong>当前状态：</strong>项目刚刚启动<br>
      第 2 天｜仓库初始化完成，功能开发将于 Day 7 开始
    </div>

    <hr>

    <footer>
      本页面为占位页，尚无实际功能。
    </footer>
  </main>
</body>
</html>
